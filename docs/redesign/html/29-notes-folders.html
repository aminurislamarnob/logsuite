<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notes folders</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A5A1F}a:hover{color:#6A4314}
button{font-family:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #2B2522; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1A1614">

  <div aria-hidden="true" style="position: absolute; right: 16px; top: 120px; width: 110px; display: flex; flex-direction: column; gap: 12px; opacity: 0.16">
    <span style="height: 48px; border-radius: 24px; background: #FFFFFF"></span>
    <span style="height: 150px; border-radius: 24px; background: #FFFFFF"></span>
    <span style="height: 148px; border-radius: 22px; background: #FFFFFF"></span>
    <span style="height: 120px; border-radius: 22px; background: #FFFFFF"></span>
  </div>

  <nav aria-label="Notes folders" style="position: absolute; left: 0; top: 0; bottom: 0; width: 316px; background: #F4F1EE; border-radius: 0 32px 32px 0; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 6px; box-shadow: 20px 0 60px rgba(0,0,0,0.35)">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px 10px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.8px">Notes</h1>
      <a href="#" aria-label="Close" style="width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>

    <a href="#" aria-current="page" style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 14px; border-radius: 18px; background: #1A1614; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 700"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h8l4 4V20.5H6z"></path><path d="M9 12h6M9 16h4"></path></svg><span style="flex-grow: 1">All Notes</span><span style="font-size: 13px; font-weight: 700; color: #B5ADA8">14</span></a>
    <a href="#" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; border-radius: 18px; color: #1A1614; text-decoration: none; font-size: 15px; font-weight: 600"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#D98A2B"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"></path></svg><span style="flex-grow: 1">Favorites</span><span style="font-size: 13px; color: #6B625C">3</span></a>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 6px 4px 14px"><span style="font-size: 12px; font-weight: 700; color: #6B625C; letter-spacing: 0.8px; text-transform: uppercase">Folders</span><button aria-label="New folder" style="width: 44px; height: 44px; margin: -8px -8px -8px 0; border-radius: 22px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button></div>
    <div style="background: #FFFFFF; border-radius: 20px; padding: 2px 14px; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
      <a href="#" style="display: flex; align-items: center; gap: 12px; height: 48px; border-bottom: 1px solid #F0ECE8; color: #1A1614; text-decoration: none; font-size: 15px; font-weight: 600"><span style="width: 10px; height: 10px; border-radius: 5px; background: #E24E32"></span><span style="flex-grow: 1">Health</span><span style="font-size: 13px; color: #6B625C">4</span></a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; height: 48px; border-bottom: 1px solid #F0ECE8; color: #1A1614; text-decoration: none; font-size: 15px; font-weight: 600"><span style="width: 10px; height: 10px; border-radius: 5px; background: #4A67C4"></span><span style="flex-grow: 1">Work</span><span style="font-size: 13px; color: #6B625C">6</span></a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; height: 48px; color: #1A1614; text-decoration: none; font-size: 15px; font-weight: 600"><span style="width: 10px; height: 10px; border-radius: 5px; background: #2D8657"></span><span style="flex-grow: 1">Personal</span><span style="font-size: 13px; color: #6B625C">4</span></a>
    </div>

    <span style="font-size: 12px; font-weight: 700; color: #6B625C; letter-spacing: 0.8px; text-transform: uppercase; padding: 16px 14px 6px">Tags</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 0 2px">
      <button style="height: 44px; padding: 0 16px; border-radius: 22px; border: none; background: #FFFFFF; color: #1A1614; font-size: 14px; font-weight: 600; box-shadow: 0 1px 2px rgba(26,22,20,0.05)">#ideas <span style="color: #6B625C; font-weight: 500">3</span></button>
      <button style="height: 44px; padding: 0 16px; border-radius: 22px; border: none; background: #FFFFFF; color: #1A1614; font-size: 14px; font-weight: 600; box-shadow: 0 1px 2px rgba(26,22,20,0.05)">#health <span style="color: #6B625C; font-weight: 500">2</span></button>
      <button style="height: 44px; padding: 0 16px; border-radius: 22px; border: none; background: #FFFFFF; color: #1A1614; font-size: 14px; font-weight: 600; box-shadow: 0 1px 2px rgba(26,22,20,0.05)">#dev <span style="color: #6B625C; font-weight: 500">5</span></button>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid #E4DFDB; padding-top: 10px">
      <a href="#" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; border-radius: 18px; color: #1A1614; text-decoration: none; font-size: 15px; font-weight: 600"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 5h16v4H4zM6 9v10h12V9M10 13h4"></path></svg><span style="flex-grow: 1">Archive</span><span style="font-size: 13px; color: #6B625C">2</span></a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; border-radius: 18px; color: #1A1614; text-decoration: none; font-size: 15px; font-weight: 600"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"></path></svg><span style="flex-grow: 1">Trash</span><span style="font-size: 13px; color: #6B625C">1</span></a>
    </div>
  </nav>
</div>

</html>
