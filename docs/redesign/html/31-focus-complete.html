<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session complete</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#59C2CC}a:hover{color:#8ADBE3}
button{font-family:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #14100F; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #FFFFFF; padding: 56px 20px 28px; display: flex; flex-direction: column; gap: 18px">

  <header style="display: flex; align-items: center; gap: 10px">
    <a href="#" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0 0 0 2px; font-size: 28px; font-weight: 800; letter-spacing: -0.8px; flex-grow: 1">Focus</h1>
    <a href="#" style="height: 44px; padding: 0 16px 0 12px; border-radius: 22px; background: rgba(255,255,255,0.08); color: #FFFFFF; font-size: 14px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9"></path></svg>Stats</a>
  </header>

  <div style="position: relative; width: 250px; height: 250px; align-self: center; margin-top: 10px">
    <svg role="img" aria-label="Session complete" width="250" height="250" viewBox="0 0 250 250"><circle cx="125" cy="125" r="112" fill="rgba(89,194,204,0.10)" stroke="#59C2CC" stroke-width="14"></circle></svg>
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
      <span style="width: 44px; height: 44px; border-radius: 22px; background: #59C2CC; display: flex; align-items: center; justify-content: center; margin-bottom: 4px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14100F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span>
      <span style="font-size: 64px; font-weight: 800; letter-spacing: -3px; line-height: 1">25:00</span>
      <span style="font-size: 14px; color: #B5ADA8">focused</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
    <span style="font-size: 12px; font-weight: 700; color: #59C2CC; letter-spacing: 1.2px; text-transform: uppercase">Session complete</span>
    <span style="font-size: 22px; font-weight: 700; letter-spacing: -0.4px">Session 2 of 4 done</span>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 20px; background: rgba(255,255,255,0.07)">
    <span style="width: 26px; height: 26px; border-radius: 13px; border: 2.5px solid #7E9CF6; box-sizing: border-box; flex-shrink: 0"></span>
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 15px; font-weight: 600">Finish design review</span><span style="font-size: 12px; color: #B5ADA8">25 min logged · 50 min total</span></div>
    <button style="height: 44px; padding: 0 14px; border-radius: 22px; border: none; background: rgba(255,255,255,0.10); color: #FFFFFF; font-size: 13px; font-weight: 700; flex-shrink: 0">Mark done</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px"><span style="font-size: 12px; font-weight: 700; color: #A39B96; letter-spacing: 0.8px; text-transform: uppercase">Focus quality</span><span style="font-size: 13px; color: #B5ADA8">Deep focus</span></div>
    <div role="radiogroup" aria-label="Focus quality, 1 to 5" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
      <button role="radio" aria-checked="false" style="height: 52px; border-radius: 18px; border: none; background: rgba(255,255,255,0.08); color: #FFFFFF; font-size: 18px; font-weight: 700">1</button>
      <button role="radio" aria-checked="false" style="height: 52px; border-radius: 18px; border: none; background: rgba(255,255,255,0.08); color: #FFFFFF; font-size: 18px; font-weight: 700">2</button>
      <button role="radio" aria-checked="false" style="height: 52px; border-radius: 18px; border: none; background: rgba(255,255,255,0.08); color: #FFFFFF; font-size: 18px; font-weight: 700">3</button>
      <button role="radio" aria-checked="false" style="height: 52px; border-radius: 18px; border: none; background: rgba(255,255,255,0.08); color: #FFFFFF; font-size: 18px; font-weight: 700">4</button>
      <button role="radio" aria-checked="true" style="height: 52px; border-radius: 18px; border: none; background: #59C2CC; color: #14100F; font-size: 18px; font-weight: 800">5</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: auto">
    <div style="display: flex; align-items: center; gap: 14px; padding: 0 4px">
      <div style="flex-grow: 1; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.12)"><div style="width: 58%; height: 5px; border-radius: 3px; background: #59C2CC"></div></div>
      <span style="font-size: 13px; font-weight: 600; color: #B5ADA8; flex-shrink: 0">1h 10m of 2h goal</span>
    </div>
    <button style="height: 58px; border-radius: 29px; border: none; background: #FFFFFF; color: #14100F; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14100F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5zM16 10h2a2 2 0 0 1 0 4h-2M9 3v3M12 3v3"></path></svg>Break · 5 min</button>
    <div style="display: flex; gap: 10px">
      <button style="flex: 1; height: 52px; border-radius: 26px; border: none; background: rgba(255,255,255,0.08); color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v4.5h4.5"></path></svg>Again</button>
      <button style="flex: 1; height: 52px; border-radius: 26px; border: none; background: rgba(255,255,255,0.08); color: #FFFFFF; font-size: 15px; font-weight: 700">Finish</button>
    </div>
  </div>
</div>


</body>
</html>
