<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add medicine</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2401F}a:hover{color:#9A3016}
button{font-family:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #2B2522; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1A1614">

  <div aria-hidden="true" style="position: absolute; left: 20px; right: 20px; top: 20px; display: flex; align-items: center; gap: 12px; opacity: 0.18"><span style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF"></span><span style="height: 22px; width: 150px; border-radius: 11px; background: #FFFFFF"></span></div>

  <section aria-label="Add medicine" style="position: absolute; left: 0; right: 0; bottom: 0; height: 790px; background: #F4F1EE; border-radius: 32px 32px 0 0; box-sizing: border-box; padding: 10px 20px 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -20px 60px rgba(0,0,0,0.35)">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D9D3CE"></div>

    <div style="display: flex; align-items: center; gap: 8px">
      <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.7px; flex-grow: 1; white-space: nowrap">Add medicine</h1>
      <a href="#" aria-label="Scan prescription" style="white-space: nowrap; flex-shrink: 0; height: 40px; padding: 0 14px 0 12px; border-radius: 20px; background: #FFE7E0; color: #1A1614; font-size: 13px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B23A1F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M7 12h10"></path></svg>Scan</a>
      <a href="#" aria-label="Close" style="width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>

    <div style="display: flex; gap: 10px">
      <div style="flex: 1.6; display: flex; flex-direction: column; gap: 6px">
        <label for="mname" style="font-size: 12px; font-weight: 700; color: #6B625C; letter-spacing: 0.8px; text-transform: uppercase; padding: 0 4px">Medicine name</label>
        <input id="mname" value="Napa" style="height: 52px; padding: 0 16px; border-radius: 18px; border: none; outline: 2px solid #1A1614; outline-offset: -2px; background: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; color: #1A1614; box-sizing: border-box; width: 100%">
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
        <label for="mdose" style="font-size: 12px; font-weight: 700; color: #6B625C; letter-spacing: 0.8px; text-transform: uppercase; padding: 0 4px">Dose</label>
        <input id="mdose" value="500 mg" style="height: 52px; padding: 0 16px; border-radius: 18px; border: none; background: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600; color: #1A1614; box-sizing: border-box; width: 100%; box-shadow: 0 1px 2px rgba(26,22,20,0.05)">
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; color: #6B625C; letter-spacing: 0.8px; text-transform: uppercase; padding: 0 4px">Form</span>
      <div role="radiogroup" aria-label="Form" style="display: flex; gap: 5px">
        <button role="radio" aria-checked="true" style="white-space: nowrap; flex: 1 1 auto; height: 40px; padding: 0 8px; border-radius: 20px; border: none; background: #1A1614; color: #FFFFFF; font-size: 13px; font-weight: 700">Tablet</button>
        <button role="radio" aria-checked="false" style="white-space: nowrap; flex: 1 1 auto; height: 40px; padding: 0 8px; border-radius: 20px; border: none; background: #FFFFFF; color: #5E5752; font-size: 13px; font-weight: 600; box-shadow: 0 1px 2px rgba(26,22,20,0.05)">Capsule</button>
        <button role="radio" aria-checked="false" style="white-space: nowrap; flex: 1 1 auto; height: 40px; padding: 0 8px; border-radius: 20px; border: none; background: #FFFFFF; color: #5E5752; font-size: 13px; font-weight: 600; box-shadow: 0 1px 2px rgba(26,22,20,0.05)">Syrup</button>
        <button role="radio" aria-checked="false" style="white-space: nowrap; flex: 1 1 auto; height: 40px; padding: 0 8px; border-radius: 20px; border: none; background: #FFFFFF; color: #5E5752; font-size: 13px; font-weight: 600; box-shadow: 0 1px 2px rgba(26,22,20,0.05)">Drops</button>
        <button role="radio" aria-checked="false" style="white-space: nowrap; flex: 1 1 auto; height: 40px; padding: 0 8px; border-radius: 20px; border: none; background: #FFFFFF; color: #5E5752; font-size: 13px; font-weight: 600; box-shadow: 0 1px 2px rgba(26,22,20,0.05)">Injection</button>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1"><span style="font-size: 15px; font-weight: 700">Times a day</span><span style="font-size: 12px; color: #6B625C">Tap a time to change it</span></span>
        <button aria-label="Fewer times a day" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #F4F1EE; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"></path></svg></button>
        <span style="font-size: 24px; font-weight: 800; letter-spacing: -0.5px; width: 20px; text-align: center">3</span>
        <button aria-label="More times a day" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #1A1614; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
      </div>
      <div style="display: flex; gap: 8px">
        <button style="flex: 1; height: 44px; border-radius: 16px; border: none; background: #FFE7E0; color: #1A1614; font-size: 14px; font-weight: 700">8:00 AM</button>
        <button style="flex: 1; height: 44px; border-radius: 16px; border: none; background: #FFE7E0; color: #1A1614; font-size: 14px; font-weight: 700">2:00 PM</button>
        <button style="flex: 1; height: 44px; border-radius: 16px; border: none; background: #FFE7E0; color: #1A1614; font-size: 14px; font-weight: 700">9:00 PM</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; color: #6B625C; letter-spacing: 0.8px; text-transform: uppercase; padding: 0 4px">With food</span>
      <div role="radiogroup" aria-label="With food" style="display: flex; height: 44px; padding: 4px; box-sizing: border-box; border-radius: 22px; background: #E8E3DF">
        <button role="radio" aria-checked="false" style="flex: 1; border: none; border-radius: 18px; background: transparent; font-size: 13px; font-weight: 600; color: #5E5752">Before food</button>
        <button role="radio" aria-checked="true" style="flex: 1; border: none; border-radius: 18px; background: #1A1614; color: #FFFFFF; font-size: 13px; font-weight: 700">After food</button>
        <button role="radio" aria-checked="false" style="flex: 1; border: none; border-radius: 18px; background: transparent; font-size: 13px; font-weight: 600; color: #5E5752">Any time</button>
      </div>
    </div>

    <div style="display: flex; gap: 10px">
      <button style="flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 12px 14px; border-radius: 18px; border: none; background: #FFFFFF; text-align: left; color: #1A1614; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)"><span style="font-size: 11px; font-weight: 700; color: #6B625C; letter-spacing: 0.6px; text-transform: uppercase">Duration</span><span style="font-size: 15px; font-weight: 700">5 days</span><span style="font-size: 12px; color: #6B625C">Ends Fri 20 Nov</span></button>
      <button style="flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 12px 14px; border-radius: 18px; border: none; background: #FFFFFF; text-align: left; color: #1A1614; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)"><span style="font-size: 11px; font-weight: 700; color: #6B625C; letter-spacing: 0.6px; text-transform: uppercase">Profile</span><span style="font-size: 15px; font-weight: 700">Me</span><span style="font-size: 12px; color: #6B625C">Who takes it</span></button>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 18px; padding: 10px 14px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
      <span style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1"><span style="font-size: 15px; font-weight: 700">In stock · 15 tablets</span><span style="font-size: 12px; color: #1F6B45; font-weight: 600">Covers the course · alert at 4 left</span></span>
      <button role="switch" aria-checked="true" aria-label="Low-stock alert" style="width: 52px; height: 32px; border-radius: 16px; border: none; background: #1A1614; padding: 3px; display: flex; justify-content: flex-end; flex-shrink: 0"><span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF"></span></button>
    </div>

    <button style="height: 58px; border-radius: 29px; border: none; background: #1A1614; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 24px; margin-top: auto; box-shadow: 0 12px 30px rgba(26,22,20,0.25)"><span>Save medicine</span><span style="height: 40px; padding: 0 14px; border-radius: 20px; background: rgba(255,255,255,0.14); display: flex; align-items: center; font-size: 13px; font-weight: 700">15 doses</span></button>
  </section>
</div>


</body>
</html>
