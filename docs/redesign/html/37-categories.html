<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Categories</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6A41A8}a:hover{color:#4F2F82}
button{font-family:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 950px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F1EE; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1A1614; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 14px">

  <header style="display: flex; align-items: center; gap: 10px">
    <a href="#" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0 0 0 2px; font-size: 26px; font-weight: 800; letter-spacing: -0.8px; flex-grow: 1">Categories</h1>
    <div role="radiogroup" aria-label="Type" style="display: flex; flex-shrink: 0; height: 44px; padding: 4px; box-sizing: border-box; border-radius: 22px; background: #E8E3DF">
      <button role="radio" aria-checked="true" style="padding: 0 11px; border: none; border-radius: 18px; background: #1A1614; color: #FFFFFF; font-size: 13px; font-weight: 700">Expense</button>
      <button role="radio" aria-checked="false" style="padding: 0 11px; border: none; border-radius: 18px; background: transparent; font-size: 13px; font-weight: 600; color: #5E5752">Income</button>
    </div>
  </header>

  <span style="font-size: 13px; color: #6B625C; padding: 0 4px">10 categories · drag to reorder · spend is for November</span>

  <div style="background: #FFFFFF; border-radius: 24px; padding: 2px 4px 2px 14px; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
    <div style="display: flex; align-items: center; gap: 12px; height: 56px; border-bottom: 1px solid #F0ECE8"><span style="width: 36px; height: 36px; border-radius: 12px; background: #F4EEFB; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7E52BE" stroke-width="2" stroke-linecap="round"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M16 21V3c-2 1-3 4-3 7h3"></path></svg></span><span style="flex-grow: 1; font-size: 15px; font-weight: 600">Food</span><span style="font-size: 14px; font-weight: 700">৳ 6,200</span><button aria-label="Reorder Food" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: grab"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="#A39B96"><circle cx="8" cy="5" r="2"></circle><circle cx="16" cy="5" r="2"></circle><circle cx="8" cy="12" r="2"></circle><circle cx="16" cy="12" r="2"></circle><circle cx="8" cy="19" r="2"></circle><circle cx="16" cy="19" r="2"></circle></svg></button></div>
    <div style="display: flex; align-items: center; gap: 12px; height: 56px; border-bottom: 1px solid #F0ECE8"><span style="width: 36px; height: 36px; border-radius: 12px; background: #EAEFFD; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A67C4" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="16" height="12" rx="3"></rect><path d="M4 11h16M7 19l1-3M17 19l-1-3"></path></svg></span><span style="flex-grow: 1; font-size: 15px; font-weight: 600">Transport</span><span style="font-size: 14px; font-weight: 700">৳ 2,300</span><button aria-label="Reorder Transport" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: grab"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="#A39B96"><circle cx="8" cy="5" r="2"></circle><circle cx="16" cy="5" r="2"></circle><circle cx="8" cy="12" r="2"></circle><circle cx="16" cy="12" r="2"></circle><circle cx="8" cy="19" r="2"></circle><circle cx="16" cy="19" r="2"></circle></svg></button></div>
    <div style="display: flex; align-items: center; gap: 12px; height: 56px; border-bottom: 1px solid #F0ECE8"><span style="width: 36px; height: 36px; border-radius: 12px; background: #FBF1E3; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A35E12" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6" stroke-linecap="round"></path></svg></span><span style="flex-grow: 1; font-size: 15px; font-weight: 600">Bills</span><span style="font-size: 14px; font-weight: 700">৳ 4,100</span><button aria-label="Reorder Bills" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: grab"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="#A39B96"><circle cx="8" cy="5" r="2"></circle><circle cx="16" cy="5" r="2"></circle><circle cx="8" cy="12" r="2"></circle><circle cx="16" cy="12" r="2"></circle><circle cx="8" cy="19" r="2"></circle><circle cx="16" cy="19" r="2"></circle></svg></button></div>
    <div style="display: flex; align-items: center; gap: 12px; height: 56px; border-bottom: 1px solid #F0ECE8"><span style="width: 36px; height: 36px; border-radius: 12px; background: #E6F4EC; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F6B45" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 5h2.5l2 10h10l2-7H7"></path><circle cx="9" cy="19" r="1.5"></circle><circle cx="16.5" cy="19" r="1.5"></circle></svg></span><span style="flex-grow: 1; font-size: 15px; font-weight: 600">Groceries</span><span style="font-size: 14px; font-weight: 700">৳ 1,310</span><button aria-label="Reorder Groceries" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: grab"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="#A39B96"><circle cx="8" cy="5" r="2"></circle><circle cx="16" cy="5" r="2"></circle><circle cx="8" cy="12" r="2"></circle><circle cx="16" cy="12" r="2"></circle><circle cx="8" cy="19" r="2"></circle><circle cx="16" cy="19" r="2"></circle></svg></button></div>
    <div style="display: flex; align-items: center; gap: 12px; height: 56px; border-bottom: 1px solid #F0ECE8"><span style="width: 36px; height: 36px; border-radius: 12px; background: #FFE7E0; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B23A1F" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2.5"></rect><path d="M8 21h8M10 9l4.5 2.5L10 14z"></path></svg></span><span style="flex-grow: 1; font-size: 15px; font-weight: 600">Entertainment</span><span style="font-size: 14px; color: #6B625C">No spend</span><button aria-label="Reorder Entertainment" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: grab"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="#A39B96"><circle cx="8" cy="5" r="2"></circle><circle cx="16" cy="5" r="2"></circle><circle cx="8" cy="12" r="2"></circle><circle cx="16" cy="12" r="2"></circle><circle cx="8" cy="19" r="2"></circle><circle cx="16" cy="19" r="2"></circle></svg></button></div>
    <div style="display: flex; align-items: center; gap: 12px; height: 56px; border-bottom: 1px solid #F0ECE8"><span style="width: 36px; height: 36px; border-radius: 12px; background: #FFE7E0; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B23A1F" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.3-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.7-7 10-7 10z"></path></svg></span><span style="flex-grow: 1; font-size: 15px; font-weight: 600">Health</span><span style="font-size: 14px; font-weight: 700">৳ 1,140</span><button aria-label="Reorder Health" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: grab"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="#A39B96"><circle cx="8" cy="5" r="2"></circle><circle cx="16" cy="5" r="2"></circle><circle cx="8" cy="12" r="2"></circle><circle cx="16" cy="12" r="2"></circle><circle cx="8" cy="19" r="2"></circle><circle cx="16" cy="19" r="2"></circle></svg></button></div>
    <div style="display: flex; align-items: center; gap: 12px; height: 56px; border-bottom: 1px solid #F0ECE8"><span style="width: 36px; height: 36px; border-radius: 12px; background: #E6F4F5; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F6A72" stroke-width="2" stroke-linejoin="round"><path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"></path></svg></span><span style="flex-grow: 1; font-size: 15px; font-weight: 600">Education</span><span style="font-size: 14px; color: #6B625C">No spend</span><button aria-label="Reorder Education" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: grab"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="#A39B96"><circle cx="8" cy="5" r="2"></circle><circle cx="16" cy="5" r="2"></circle><circle cx="8" cy="12" r="2"></circle><circle cx="16" cy="12" r="2"></circle><circle cx="8" cy="19" r="2"></circle><circle cx="16" cy="19" r="2"></circle></svg></button></div>
    <div style="display: flex; align-items: center; gap: 12px; height: 56px; border-bottom: 1px solid #F0ECE8"><span style="width: 36px; height: 36px; border-radius: 12px; background: #F4EEFB; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7E52BE" stroke-width="2" stroke-linejoin="round"><path d="M5 8h14l-1.5 12h-11z"></path><path d="M9 8a3 3 0 0 1 6 0" stroke-linecap="round"></path></svg></span><span style="flex-grow: 1; font-size: 15px; font-weight: 600">Shopping</span><span style="font-size: 14px; font-weight: 700">৳ 3,400</span><button aria-label="Reorder Shopping" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: grab"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="#A39B96"><circle cx="8" cy="5" r="2"></circle><circle cx="16" cy="5" r="2"></circle><circle cx="8" cy="12" r="2"></circle><circle cx="16" cy="12" r="2"></circle><circle cx="8" cy="19" r="2"></circle><circle cx="16" cy="19" r="2"></circle></svg></button></div>
    <div style="display: flex; align-items: center; gap: 12px; height: 56px; border-bottom: 1px solid #F0ECE8"><span style="width: 36px; height: 36px; border-radius: 12px; background: #E3F1FA; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#02598A" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3"></circle><path d="M3 20a6 6 0 0 1 12 0"></path><circle cx="17" cy="9" r="2.3"></circle><path d="M16 14.5a5 5 0 0 1 5 5"></path></svg></span><span style="flex-grow: 1; font-size: 15px; font-weight: 600">Family</span><span style="font-size: 14px; color: #6B625C">No spend</span><button aria-label="Reorder Family" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: grab"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="#A39B96"><circle cx="8" cy="5" r="2"></circle><circle cx="16" cy="5" r="2"></circle><circle cx="8" cy="12" r="2"></circle><circle cx="16" cy="12" r="2"></circle><circle cx="8" cy="19" r="2"></circle><circle cx="16" cy="19" r="2"></circle></svg></button></div>
    <div style="display: flex; align-items: center; gap: 12px; height: 56px"><span style="width: 36px; height: 36px; border-radius: 12px; background: #F0ECE8; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E5752" stroke-width="2.2" stroke-linecap="round"><path d="M5 9h14M5 15h14M10 4l-2 16M16 4l-2 16"></path></svg></span><span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 15px; font-weight: 600">Other</span><span style="font-size: 11px; color: #6B625C">Fallback · cannot be deleted</span></span><span style="font-size: 14px; color: #6B625C">No spend</span><span aria-hidden="true" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A39B96" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2.5"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span></div>
  </div>

  <section aria-label="New category" style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 14px; outline: 2px solid #1A1614; outline-offset: -2px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 10px 30px rgba(26,22,20,0.10)">
    <div style="display: flex; align-items: center; gap: 10px">
      <button aria-label="Choose icon" style="width: 52px; height: 52px; border-radius: 18px; border: none; background: #E6F4F5; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1F6A72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20c0-6 3-11 7-13 4 2 7 7 7 13M9 20v-4h6v4M12 3v4"></path></svg></button>
      <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0">
        <label for="cname" style="font-size: 11px; font-weight: 700; color: #6B625C; letter-spacing: 0.8px; text-transform: uppercase">New category</label>
        <input id="cname" value="Travel" style="width: 100%; box-sizing: border-box; border: none; outline: none; background: transparent; font-family: inherit; font-size: 20px; font-weight: 700; color: #1A1614; padding: 0">
      </div>
    </div>
    <div role="radiogroup" aria-label="Colour" style="display: flex; align-items: center; justify-content: space-between">
      <button role="radio" aria-checked="false" aria-label="Violet" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: #9A6DD7"></button>
      <button role="radio" aria-checked="false" aria-label="Indigo" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: #5B7CE0"></button>
      <button role="radio" aria-checked="true" aria-label="Teal, selected" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: #349CA5; box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 5px #1A1614"></button>
      <button role="radio" aria-checked="false" aria-label="Green" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: #2D8657"></button>
      <button role="radio" aria-checked="false" aria-label="Amber" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: #C38131"></button>
      <button role="radio" aria-checked="false" aria-label="Coral" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: #F15F43"></button>
      <button role="radio" aria-checked="false" aria-label="Sky" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: #0284C7"></button>
    </div>
    <div style="display: flex; gap: 8px">
      <button style="height: 48px; padding: 0 20px; border-radius: 24px; border: none; background: #F4F1EE; color: #1A1614; font-size: 15px; font-weight: 700">Cancel</button>
      <button style="flex: 1; height: 48px; border-radius: 24px; border: none; background: #1A1614; color: #FFFFFF; font-size: 15px; font-weight: 700">Create</button>
    </div>
  </section>
</div>


</body>
</html>
