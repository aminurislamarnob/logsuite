<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Medicines</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2401F}a:hover{color:#9A3016}
button{font-family:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F1EE; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1A1614; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 14px">

  <header style="display: flex; align-items: center; gap: 10px">
    <a href="#" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0 0 0 2px; font-size: 28px; font-weight: 800; letter-spacing: -0.8px; flex-grow: 1">Medicine</h1>
    <button aria-label="Share schedule" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4M5 13v6h14v-6"></path></svg></button>
    <a href="#" aria-label="Add medicine" style="width: 44px; height: 44px; border-radius: 22px; background: #1A1614; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></a>
  </header>

  <div role="tablist" aria-label="Views" style="display: flex; height: 44px; padding: 4px; box-sizing: border-box; border-radius: 22px; background: #E8E3DF">
    <a role="tab" aria-selected="false" href="#" style="flex: 0.85; border-radius: 18px; font-size: 12.5px; font-weight: 600; color: #5E5752; text-decoration: none; display: flex; align-items: center; justify-content: center">Today</a>
    <a role="tab" aria-selected="false" href="#" style="flex: 1.05; border-radius: 18px; font-size: 12.5px; font-weight: 600; color: #5E5752; text-decoration: none; display: flex; align-items: center; justify-content: center">Timeline</a>
    <a role="tab" aria-selected="false" href="#" style="flex: 1.1; border-radius: 18px; font-size: 12.5px; font-weight: 600; color: #5E5752; text-decoration: none; display: flex; align-items: center; justify-content: center">Calendar</a>
    <a role="tab" aria-selected="false" href="#" style="flex: 0.8; border-radius: 18px; font-size: 12.5px; font-weight: 600; color: #5E5752; text-decoration: none; display: flex; align-items: center; justify-content: center">Table</a>
    <a role="tab" aria-selected="true" href="#" style="flex: 1.2; border-radius: 18px; background: #1A1614; color: #FFFFFF; font-size: 12.5px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Medicines</a>
  </div>

  <div role="radiogroup" aria-label="Profile" style="display: flex; gap: 8px">
    <button role="radio" aria-checked="true" style="white-space: nowrap; height: 44px; padding: 0 16px; border-radius: 22px; border: none; background: #1A1614; color: #FFFFFF; font-size: 14px; font-weight: 700">Everyone</button>
    <button role="radio" aria-checked="false" style="white-space: nowrap; height: 44px; padding: 0 14px 0 6px; border-radius: 22px; border: none; background: #FFFFFF; color: #1A1614; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 2px rgba(26,22,20,0.05)"><span style="width: 32px; height: 32px; border-radius: 16px; background: #1A1614; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">AR</span>Me</button>
    <button role="radio" aria-checked="false" style="white-space: nowrap; height: 44px; padding: 0 14px 0 6px; border-radius: 22px; border: none; background: #FFFFFF; color: #1A1614; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 2px rgba(26,22,20,0.05)"><span style="width: 32px; height: 32px; border-radius: 16px; background: #F4EEFB; color: #5B3A99; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">M</span>Mum</button>
    <button aria-label="Add profile" style="width: 44px; height: 44px; flex-shrink: 0; padding: 0; border-radius: 22px; border: 1.5px dashed #BFB7B0; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E5752" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
  </div>

  <article style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 52px; height: 52px; border-radius: 18px; background: #FFE7E0; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#E24E32" stroke-width="2"><rect x="3.5" y="8.5" width="17" height="7" rx="3.5" transform="rotate(-40 12 12)"></rect><path d="M9.6 8.8l4.8 6.4"></path></svg></span>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
        <span style="font-size: 18px; font-weight: 700; letter-spacing: -0.3px">Napa 500 mg</span>
        <span style="font-size: 13px; color: #6B625C">Tablet · 3× daily · after food</span>
      </div>
      <button aria-label="Edit Napa" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #F4F1EE; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L19 8l-3-3L5 16z"></path></svg></button>
    </div>
    <div style="display: flex; gap: 6px"><span style="height: 30px; padding: 0 10px; border-radius: 15px; background: #F4F1EE; font-size: 12px; font-weight: 700; display: flex; align-items: center">8:00 AM</span><span style="height: 30px; padding: 0 10px; border-radius: 15px; background: #F4F1EE; font-size: 12px; font-weight: 700; display: flex; align-items: center">2:00 PM</span><span style="height: 30px; padding: 0 10px; border-radius: 15px; background: #F4F1EE; font-size: 12px; font-weight: 700; display: flex; align-items: center">9:00 PM</span><span style="height: 30px; padding: 0 10px; border-radius: 15px; background: #1A1614; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; margin-left: auto">Me</span></div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 600">Day 2 of 5</span><span style="color: #6B625C">Ends Fri 20 Nov</span></div>
      <div style="height: 6px; border-radius: 3px; background: #EFEAE6"><div style="width: 40%; height: 6px; border-radius: 3px; background: #E24E32"></div></div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding-top: 2px">
      <span style="flex-grow: 1; font-size: 13px; font-weight: 600; color: #1F6B45">11 tablets left · covers the course</span>
      <button style="height: 44px; padding: 0 14px; border-radius: 22px; border: none; background: #F4F1EE; color: #1A1614; font-size: 13px; font-weight: 700">Add stock</button>
    </div>
  </article>

  <article style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 52px; height: 52px; border-radius: 18px; background: #FBF1E3; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#A35E12" stroke-width="2" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="5"></rect><path d="M7 12h10"></path></svg></span>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
        <span style="font-size: 18px; font-weight: 700; letter-spacing: -0.3px">Omeprazole 20 mg</span>
        <span style="font-size: 13px; color: #6B625C">Capsule · 1× daily · before food</span>
      </div>
      <button aria-label="Edit Omeprazole" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #F4F1EE; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L19 8l-3-3L5 16z"></path></svg></button>
    </div>
    <div style="display: flex; gap: 6px"><span style="height: 30px; padding: 0 10px; border-radius: 15px; background: #F4F1EE; font-size: 12px; font-weight: 700; display: flex; align-items: center">8:00 AM</span><span style="height: 30px; padding: 0 10px; border-radius: 15px; background: #F4F1EE; font-size: 12px; font-weight: 600; color: #5E5752; display: flex; align-items: center">Ongoing</span><span style="height: 30px; padding: 0 10px; border-radius: 15px; background: #1A1614; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; margin-left: auto">Me</span></div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; border-radius: 18px; background: #FBF1E3">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A35E12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9 16H3z"></path><path d="M12 10v4M12 17h.01"></path></svg>
      <span style="flex-grow: 1; font-size: 13px; font-weight: 700; color: #7A4A10">4 left · runs out Sat</span>
      <button style="height: 44px; padding: 0 14px; border-radius: 22px; border: none; background: #1A1614; color: #FFFFFF; font-size: 13px; font-weight: 700; white-space: nowrap; flex-shrink: 0">Add stock</button>
    </div>
  </article>

  <div style="display: flex; gap: 10px">
    <button style="flex: 1; height: 52px; border-radius: 20px; border: none; background: #FFFFFF; color: #1A1614; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-6 4 12 2-6h6"></path></svg>Log a symptom</button>
    <button style="flex: 1; height: 52px; border-radius: 20px; border: none; background: #FFFFFF; color: #1A1614; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4M5 13v6h14v-6"></path></svg>Share schedule</button>
  </div>
</div>


</body>
</html>
