<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Habits</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#22694A}a:hover{color:#174D35}
button{font-family:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F1EE; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1A1614; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 16px">

  <header style="display: flex; align-items: center; gap: 10px">
    <a href="#" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0 0 0 2px; font-size: 28px; font-weight: 800; letter-spacing: -0.8px; flex-grow: 1">Habits</h1>
    <button aria-label="Stats" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9"></path></svg></button>
    <button aria-label="New habit" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #1A1614; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
  </header>

  <section aria-label="This week" style="background: #1A1614; color: #FFFFFF; border-radius: 28px; padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 16px 40px rgba(26,22,20,0.22)">
    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 12px; font-weight: 700; color: #2D8657; letter-spacing: 1px; text-transform: uppercase">Today</span>
        <div style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 44px; font-weight: 800; letter-spacing: -2px; line-height: 1">3</span><span style="font-size: 20px; font-weight: 600; color: #8C847F">of 5</span></div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
        <span style="display: flex; align-items: center; gap: 4px; font-size: 22px; font-weight: 800; letter-spacing: -0.5px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#FFB95C"><path d="M12 22c-4.4 0-7-2.8-7-6.5 0-4.3 3.8-6.5 4.3-11 2.7 1.6 3.8 4.3 3.8 6.5 1.1-.6 2.2-1.9 2.4-3.3 2 2 3.5 4.6 3.5 7.6 0 3.9-2.6 6.7-7 6.7z"></path></svg>21</span>
        <span style="font-size: 12px; color: #8C847F">best streak</span>
      </div>
    </div>
    <div role="group" aria-label="Last 7 days" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
      <button style="display: flex; flex-direction: column; align-items: center; gap: 8px; border: none; background: transparent; padding: 0; color: #FFFFFF"><span style="font-size: 11px; color: #8C847F">W</span><svg role="img" aria-label="Wednesday, all done" width="36" height="36" viewBox="0 0 36 36"><circle cx="18" cy="18" r="14" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="5"></circle><circle cx="18" cy="18" r="14" fill="none" stroke="#2D8657" stroke-width="5" stroke-linecap="round" stroke-dasharray="88 88" transform="rotate(-90 18 18)"></circle></svg></button>
      <button style="display: flex; flex-direction: column; align-items: center; gap: 8px; border: none; background: transparent; padding: 0; color: #FFFFFF"><span style="font-size: 11px; color: #8C847F">T</span><svg role="img" aria-label="Thursday, all done" width="36" height="36" viewBox="0 0 36 36"><circle cx="18" cy="18" r="14" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="5"></circle><circle cx="18" cy="18" r="14" fill="none" stroke="#2D8657" stroke-width="5" stroke-linecap="round" stroke-dasharray="88 88" transform="rotate(-90 18 18)"></circle></svg></button>
      <button style="display: flex; flex-direction: column; align-items: center; gap: 8px; border: none; background: transparent; padding: 0; color: #FFFFFF"><span style="font-size: 11px; color: #8C847F">F</span><svg role="img" aria-label="Friday, 3 of 5" width="36" height="36" viewBox="0 0 36 36"><circle cx="18" cy="18" r="14" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="5"></circle><circle cx="18" cy="18" r="14" fill="none" stroke="#2D8657" stroke-width="5" stroke-linecap="round" stroke-dasharray="53 88" transform="rotate(-90 18 18)"></circle></svg></button>
      <button style="display: flex; flex-direction: column; align-items: center; gap: 8px; border: none; background: transparent; padding: 0; color: #FFFFFF"><span style="font-size: 11px; color: #8C847F">S</span><svg role="img" aria-label="Saturday, all done" width="36" height="36" viewBox="0 0 36 36"><circle cx="18" cy="18" r="14" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="5"></circle><circle cx="18" cy="18" r="14" fill="none" stroke="#2D8657" stroke-width="5" stroke-linecap="round" stroke-dasharray="88 88" transform="rotate(-90 18 18)"></circle></svg></button>
      <button style="display: flex; flex-direction: column; align-items: center; gap: 8px; border: none; background: transparent; padding: 0; color: #FFFFFF"><span style="font-size: 11px; color: #8C847F">S</span><svg role="img" aria-label="Sunday, all done" width="36" height="36" viewBox="0 0 36 36"><circle cx="18" cy="18" r="14" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="5"></circle><circle cx="18" cy="18" r="14" fill="none" stroke="#2D8657" stroke-width="5" stroke-linecap="round" stroke-dasharray="88 88" transform="rotate(-90 18 18)"></circle></svg></button>
      <button style="display: flex; flex-direction: column; align-items: center; gap: 8px; border: none; background: transparent; padding: 0; color: #FFFFFF"><span style="font-size: 11px; color: #8C847F">M</span><svg role="img" aria-label="Monday, 4 of 5" width="36" height="36" viewBox="0 0 36 36"><circle cx="18" cy="18" r="14" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="5"></circle><circle cx="18" cy="18" r="14" fill="none" stroke="#2D8657" stroke-width="5" stroke-linecap="round" stroke-dasharray="70 88" transform="rotate(-90 18 18)"></circle></svg></button>
      <button aria-current="date" style="display: flex; flex-direction: column; align-items: center; gap: 8px; border: none; background: transparent; padding: 0; color: #FFFFFF"><span style="font-size: 11px; font-weight: 800; color: #FFFFFF">T</span><svg role="img" aria-label="Today, 3 of 5" width="36" height="36" viewBox="0 0 36 36"><circle cx="18" cy="18" r="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="5"></circle><circle cx="18" cy="18" r="14" fill="none" stroke="#2D8657" stroke-width="5" stroke-linecap="round" stroke-dasharray="53 88" transform="rotate(-90 18 18)"></circle></svg></button>
    </div>
  </section>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 22px; padding: 12px 12px 12px 14px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
      <span style="width: 46px; height: 46px; border-radius: 16px; background: #E6F4EC; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2D8657" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4l-1.5 5 4 1.5 2 7M9 21l2.5-7 3 1.5M6 13l3-4 4 2"></path><circle cx="15" cy="4.5" r="1.5"></circle></svg></span>
      <div style="display: flex; flex-direction: column; gap: 7px; flex-grow: 1; min-width: 0">
        <div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 16px; font-weight: 700">Evening walk</span><span style="font-size: 12px; font-weight: 700; color: #B8641A; display: flex; align-items: center; gap: 2px"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="#E0802F"><path d="M12 22c-4.4 0-7-2.8-7-6.5 0-4.3 3.8-6.5 4.3-11 2.7 1.6 3.8 4.3 3.8 6.5 1.1-.6 2.2-1.9 2.4-3.3 2 2 3.5 4.6 3.5 7.6 0 3.9-2.6 6.7-7 6.7z"></path></svg>12</span></div>
        <div aria-label="Last 7 days: 6 of 7" style="display: flex; gap: 4px"><span style="width: 16px; height: 5px; border-radius: 3px; background: #2D8657"></span><span style="width: 16px; height: 5px; border-radius: 3px; background: #2D8657"></span><span style="width: 16px; height: 5px; border-radius: 3px; background: #2D8657"></span><span style="width: 16px; height: 5px; border-radius: 3px; background: #2D8657"></span><span style="width: 16px; height: 5px; border-radius: 3px; background: #2D8657"></span><span style="width: 16px; height: 5px; border-radius: 3px; background: #2D8657"></span><span style="width: 16px; height: 5px; border-radius: 3px; background: #EFEAE6"></span></div>
      </div>
      <button aria-label="Mark Evening walk done" style="width: 48px; height: 48px; border-radius: 24px; border: 2.5px solid #D4CEC8; background: #FFFFFF"></button>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 22px; padding: 12px 12px 12px 14px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
      <span style="width: 46px; height: 46px; border-radius: 16px; background: #E4F3F4; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B8790" stroke-width="2" stroke-linejoin="round"><path d="M12 3s6 7 6 11.5a6 6 0 0 1-12 0C6 10 12 3 12 3z"></path></svg></span>
      <div style="display: flex; flex-direction: column; gap: 7px; flex-grow: 1; min-width: 0">
        <div style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 16px; font-weight: 700">Drink water</span><span style="font-size: 12px; font-weight: 600; color: #8C847F">5 / 8 glasses</span></div>
        <div style="height: 5px; border-radius: 3px; background: #EFEAE6; max-width: 150px"><div style="width: 62%; height: 5px; border-radius: 3px; background: #2B8790"></div></div>
      </div>
      <button aria-label="Add a glass" style="width: 48px; height: 48px; border-radius: 24px; border: none; background: #E4F3F4; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F6A72" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 22px; padding: 12px 12px 12px 14px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
      <span style="width: 46px; height: 46px; border-radius: 16px; background: #FBF1E3; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A86C22" stroke-width="2" stroke-linejoin="round"><path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"></path></svg></span>
      <div style="display: flex; flex-direction: column; gap: 7px; flex-grow: 1; min-width: 0">
        <div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 16px; font-weight: 700">Read 20 pages</span><span style="font-size: 12px; font-weight: 700; color: #B8641A; display: flex; align-items: center; gap: 2px"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="#E0802F"><path d="M12 22c-4.4 0-7-2.8-7-6.5 0-4.3 3.8-6.5 4.3-11 2.7 1.6 3.8 4.3 3.8 6.5 1.1-.6 2.2-1.9 2.4-3.3 2 2 3.5 4.6 3.5 7.6 0 3.9-2.6 6.7-7 6.7z"></path></svg>21</span></div>
        <div aria-label="Last 7 days: 7 of 7" style="display: flex; gap: 4px"><span style="width: 16px; height: 5px; border-radius: 3px; background: #2D8657"></span><span style="width: 16px; height: 5px; border-radius: 3px; background: #2D8657"></span><span style="width: 16px; height: 5px; border-radius: 3px; background: #2D8657"></span><span style="width: 16px; height: 5px; border-radius: 3px; background: #2D8657"></span><span style="width: 16px; height: 5px; border-radius: 3px; background: #2D8657"></span><span style="width: 16px; height: 5px; border-radius: 3px; background: #2D8657"></span><span style="width: 16px; height: 5px; border-radius: 3px; background: #2D8657"></span></div>
      </div>
      <button aria-label="Read 20 pages done, tap to undo" style="width: 48px; height: 48px; border-radius: 24px; border: none; background: #2D8657; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></button>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 22px; padding: 12px 12px 12px 14px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
      <span style="width: 46px; height: 46px; border-radius: 16px; background: #FFECE7; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E24E32" stroke-width="2" stroke-linecap="round"><path d="M4 18a8 8 0 0 1 16 0zM12 3v3M5 7l2 2M19 7l-2 2M2 21h20"></path></svg></span>
      <div style="display: flex; flex-direction: column; gap: 7px; flex-grow: 1; min-width: 0">
        <div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 16px; font-weight: 700">Fajr on time</span><span style="font-size: 12px; font-weight: 700; color: #B8641A; display: flex; align-items: center; gap: 2px"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="#E0802F"><path d="M12 22c-4.4 0-7-2.8-7-6.5 0-4.3 3.8-6.5 4.3-11 2.7 1.6 3.8 4.3 3.8 6.5 1.1-.6 2.2-1.9 2.4-3.3 2 2 3.5 4.6 3.5 7.6 0 3.9-2.6 6.7-7 6.7z"></path></svg>5</span></div>
        <div aria-label="Last 7 days: 5 of 7" style="display: flex; gap: 4px"><span style="width: 16px; height: 5px; border-radius: 3px; background: #EFEAE6"></span><span style="width: 16px; height: 5px; border-radius: 3px; background: #2D8657"></span><span style="width: 16px; height: 5px; border-radius: 3px; background: #EFEAE6"></span><span style="width: 16px; height: 5px; border-radius: 3px; background: #2D8657"></span><span style="width: 16px; height: 5px; border-radius: 3px; background: #2D8657"></span><span style="width: 16px; height: 5px; border-radius: 3px; background: #2D8657"></span><span style="width: 16px; height: 5px; border-radius: 3px; background: #2D8657"></span></div>
      </div>
      <button aria-label="Fajr on time done, tap to undo" style="width: 48px; height: 48px; border-radius: 24px; border: none; background: #2D8657; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></button>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 22px; padding: 12px 12px 12px 14px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
      <span style="width: 46px; height: 46px; border-radius: 16px; background: #F2ECFB; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7E52BE" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M6 6l12 12"></path></svg></span>
      <div style="display: flex; flex-direction: column; gap: 7px; flex-grow: 1; min-width: 0">
        <div style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 16px; font-weight: 700">No sugar</span><span style="font-size: 12px; font-weight: 600; color: #8C847F">Mon · Wed · Fri</span></div>
        <div aria-label="Last 3 scheduled days: 3 of 3" style="display: flex; gap: 4px"><span style="width: 16px; height: 5px; border-radius: 3px; background: #2D8657"></span><span style="width: 16px; height: 5px; border-radius: 3px; background: #2D8657"></span><span style="width: 16px; height: 5px; border-radius: 3px; background: #2D8657"></span></div>
      </div>
      <button aria-label="No sugar done, tap to undo" style="width: 48px; height: 48px; border-radius: 24px; border: none; background: #2D8657; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></button>
    </div>
  </div>
  <section style="display: flex; align-items: center; gap: 16px; background: #FFFFFF; border-radius: 22px; padding: 14px 16px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
    <div style="display: flex; flex-direction: column; gap: 2px; flex-shrink: 0">
      <span style="font-size: 12px; font-weight: 700; color: #8C847F; letter-spacing: 0.8px; text-transform: uppercase">4 weeks</span>
      <span style="font-size: 24px; font-weight: 800; letter-spacing: -0.6px">86%</span>
    </div>
    <div role="img" aria-label="Last 28 days: 24 fully done" style="flex-grow: 1; display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px"><span style="height: 14px; border-radius: 5px; background: #2D8657"></span><span style="height: 14px; border-radius: 5px; background: #2D8657"></span><span style="height: 14px; border-radius: 5px; background: #2D8657"></span><span style="height: 14px; border-radius: 5px; background: #E4DFDB"></span><span style="height: 14px; border-radius: 5px; background: #2D8657"></span><span style="height: 14px; border-radius: 5px; background: #2D8657"></span><span style="height: 14px; border-radius: 5px; background: #2D8657"></span><span style="height: 14px; border-radius: 5px; background: #2D8657"></span><span style="height: 14px; border-radius: 5px; background: #2D8657"></span><span style="height: 14px; border-radius: 5px; background: #2D8657"></span><span style="height: 14px; border-radius: 5px; background: #2D8657"></span><span style="height: 14px; border-radius: 5px; background: #2D8657"></span><span style="height: 14px; border-radius: 5px; background: #E4DFDB"></span><span style="height: 14px; border-radius: 5px; background: #2D8657"></span><span style="height: 14px; border-radius: 5px; background: #2D8657"></span><span style="height: 14px; border-radius: 5px; background: #2D8657"></span><span style="height: 14px; border-radius: 5px; background: #E4DFDB"></span><span style="height: 14px; border-radius: 5px; background: #2D8657"></span><span style="height: 14px; border-radius: 5px; background: #2D8657"></span><span style="height: 14px; border-radius: 5px; background: #2D8657"></span><span style="height: 14px; border-radius: 5px; background: #2D8657"></span><span style="height: 14px; border-radius: 5px; background: #2D8657"></span><span style="height: 14px; border-radius: 5px; background: #2D8657"></span><span style="height: 14px; border-radius: 5px; background: #2D8657"></span><span style="height: 14px; border-radius: 5px; background: #2D8657"></span><span style="height: 14px; border-radius: 5px; background: #2D8657"></span><span style="height: 14px; border-radius: 5px; background: #2D8657"></span><span style="height: 14px; border-radius: 5px; background: #FFFFFF; border: 2px solid #2D8657; box-sizing: border-box"></span></div>
  </section>
</div>


</body>
