<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loans</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6A41A8}a:hover{color:#4F2F82}
button{font-family:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 930px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F1EE; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1A1614; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 14px">

  <header style="display: flex; align-items: center; gap: 10px">
    <a href="#" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0 0 0 2px; font-size: 28px; font-weight: 800; letter-spacing: -0.8px; flex-grow: 1">Expenses</h1>
    <button aria-label="Change month" style="height: 44px; padding: 0 12px 0 14px; border-radius: 22px; border: none; background: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: #1A1614; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)">Nov<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8C847F" stroke-width="2.4" stroke-linecap="round"><path d="M7 10l5 5 5-5"></path></svg></button>
    <button aria-label="Export and categories" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#1A1614"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
  </header>

  <div role="tablist" aria-label="Sections" style="display: flex; height: 44px; padding: 4px; box-sizing: border-box; border-radius: 22px; background: #E8E3DF">
    <a href="#" role="tab" aria-selected="false" style="flex: 1.2; border-radius: 18px; font-size: 13px; font-weight: 600; color: #5E5752; text-decoration: none; display: flex; align-items: center; justify-content: center">Overview</a>
    <a href="#" role="tab" aria-selected="false" style="flex: 1.1; border-radius: 18px; font-size: 13px; font-weight: 600; color: #5E5752; text-decoration: none; display: flex; align-items: center; justify-content: center">Reports</a>
    <a href="#" role="tab" aria-selected="false" style="flex: 1.1; border-radius: 18px; font-size: 13px; font-weight: 600; color: #5E5752; text-decoration: none; display: flex; align-items: center; justify-content: center">Budgets</a>
    <a href="#" role="tab" aria-selected="false" style="flex: 0.8; border-radius: 18px; font-size: 13px; font-weight: 600; color: #5E5752; text-decoration: none; display: flex; align-items: center; justify-content: center">Bills</a>
    <button role="tab" aria-selected="true" style="flex: 0.9; border: none; border-radius: 18px; background: #1A1614; color: #FFFFFF; font-size: 13px; font-weight: 700">Loans</button>
  </div>

  <div style="display: flex; gap: 10px">
    <div style="flex: 1; background: #E6F4EC; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #1F5E3D"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1F5E3D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"></path></svg>Owed to me</span>
      <span style="font-size: 26px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.1">৳ 2,000</span>
      <span style="font-size: 12px; color: #3F6350">1 person</span>
    </div>
    <div style="flex: 1; background: #FBF1E3; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #8A5A1F"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A5A1F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>I owe</span>
      <span style="font-size: 26px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.1">৳ 5,000</span>
      <span style="font-size: 12px; color: #6E5530">1 person</span>
    </div>
  </div>

  <div role="tablist" aria-label="Direction" style="display: flex; height: 44px; padding: 4px; box-sizing: border-box; border-radius: 22px; background: #E8E3DF">
    <button role="tab" aria-selected="true" style="flex: 1; border: none; border-radius: 18px; background: #FFFFFF; color: #1A1614; font-size: 14px; font-weight: 700; box-shadow: 0 1px 4px rgba(26,22,20,0.10)">All</button>
    <button role="tab" aria-selected="false" style="flex: 1; border: none; border-radius: 18px; background: transparent; font-size: 14px; font-weight: 600; color: #5E5752">Lent</button>
    <button role="tab" aria-selected="false" style="flex: 1; border: none; border-radius: 18px; background: transparent; font-size: 14px; font-weight: 600; color: #5E5752">Borrowed</button>
  </div>

  <article style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 48px; height: 48px; border-radius: 24px; background: #EAEFFD; color: #3B4F8F; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0">R</span>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 17px; font-weight: 700">Rafi</span><span style="font-size: 12px; font-weight: 700; color: #1F5E3D">Lent · due 1 Dec</span></div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span style="font-size: 18px; font-weight: 800; letter-spacing: -0.4px">৳ 2,000</span><span style="font-size: 12px; color: #6B625C">of ৳ 3,000</span></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 8px; border-radius: 4px; background: #F0ECE8"><div style="width: 33%; height: 8px; border-radius: 4px; background: #2D8657"></div></div><span style="font-size: 12px; color: #6B625C">Repaid ৳ 1,000 · friend · from bKash</span></div>
    <div style="display: flex; gap: 8px">
      <button style="flex: 1; height: 44px; border-radius: 22px; border: none; background: #1A1614; color: #FFFFFF; font-size: 14px; font-weight: 700">Repayment received</button>
      <button aria-label="Remind Rafi" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #F4F1EE; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20.5a2 2 0 0 0 4 0"></path></svg></button>
    </div>
  </article>

  <article style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 48px; height: 48px; border-radius: 24px; background: #FFE7E0; color: #B23A1F; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0">B</span>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 17px; font-weight: 700">Bhaiya</span><span style="font-size: 12px; font-weight: 700; color: #8A5A1F">Borrowed · due 15 Dec</span></div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span style="font-size: 18px; font-weight: 800; letter-spacing: -0.4px">৳ 5,000</span><span style="font-size: 12px; color: #6B625C">of ৳ 8,000</span></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 8px; border-radius: 4px; background: #F0ECE8"><div style="width: 37.5%; height: 8px; border-radius: 4px; background: #D98A2B"></div></div><span style="font-size: 12px; color: #6B625C">Repaid ৳ 3,000 · family · into Bank</span></div>
    <button style="height: 44px; border-radius: 22px; border: none; background: #1A1614; color: #FFFFFF; font-size: 14px; font-weight: 700">Repay</button>
  </article>

  <button aria-expanded="false" style="display: flex; align-items: center; gap: 12px; border: none; background: #EBE6E2; border-radius: 18px; padding: 0 14px; height: 52px; flex-shrink: 0; font-size: 14px; font-weight: 600; color: #1A1614; text-align: left"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E5752" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg><span style="flex-grow: 1">Settled <span style="color: #5E5752; font-weight: 500">· 3 loans</span></span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E5752" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>

  <button style="position: absolute; right: 20px; bottom: 28px; height: 56px; padding: 0 22px 0 18px; border-radius: 28px; border: none; background: #1A1614; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; box-shadow: 0 14px 36px rgba(26,22,20,0.28)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add a loan</button>
</div>


</body>
</html>
