<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>People</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2401F}a:hover{color:#9A3016}
button{font-family:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 910px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F1EE; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1A1614; padding: 56px 20px 28px; display: flex; flex-direction: column; gap: 12px">

  <header style="display: flex; align-items: center; gap: 10px">
    <a href="#" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="display: flex; flex-direction: column; flex-grow: 1; margin-left: 2px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.1">People</h1>
      <span style="font-size: 13px; color: #6B625C">Household &amp; contacts</span>
    </div>
    <button style="height: 44px; padding: 0 16px 0 12px; border-radius: 22px; border: none; background: #1A1614; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add person</button>
  </header>

  <h2 style="margin: 6px 4px 0; font-size: 12px; font-weight: 700; color: #6B625C; letter-spacing: 0.8px; text-transform: uppercase">Household</h2>
  <div style="background: #FFFFFF; border-radius: 22px; padding: 2px 14px; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
    <button style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border: none; border-bottom: 1px solid #F0ECE8; background: transparent; text-align: left; color: #1A1614">
      <span style="width: 44px; height: 44px; border-radius: 22px; background: #1A1614; color: #FFFFFF; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0">AR</span>
      <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 16px; font-weight: 700">Me</span><span style="font-size: 12px; color: #6B625C">2 medicines · 58 expenses</span></span>
      <span style="height: 24px; padding: 0 9px; border-radius: 12px; background: #F0ECE8; font-size: 11px; font-weight: 700; color: #4A433F; display: flex; align-items: center">You</span>
    </button>
    <button style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border: none; border-bottom: 1px solid #F0ECE8; background: transparent; text-align: left; color: #1A1614">
      <span style="width: 44px; height: 44px; border-radius: 22px; background: #F4EEFB; color: #5E3A99; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0">NS</span>
      <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 16px; font-weight: 700">Nusrat <span style="font-size: 13px; font-weight: 500; color: #6B625C">· Wife</span></span><span style="font-size: 12px; color: #6B625C">1 medicine · 12 expenses</span></span>
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A39B96" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
    <button style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border: none; background: transparent; text-align: left; color: #1A1614">
      <span style="width: 44px; height: 44px; border-radius: 22px; background: #E6F4EC; color: #1F5E3D; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0">AY</span>
      <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 16px; font-weight: 700">Ayaan <span style="font-size: 13px; font-weight: 500; color: #6B625C">· Son</span></span><span style="font-size: 12px; color: #6B625C">No medicines · 6 expenses</span></span>
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A39B96" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
  </div>

  <h2 style="margin: 6px 4px 0; font-size: 12px; font-weight: 700; color: #6B625C; letter-spacing: 0.8px; text-transform: uppercase">Contacts</h2>
  <div style="background: #FFFFFF; border-radius: 22px; padding: 2px 14px; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
    <button style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border: none; border-bottom: 1px solid #F0ECE8; background: transparent; text-align: left; color: #1A1614">
      <span style="width: 44px; height: 44px; border-radius: 22px; background: #EAEFFD; color: #3B4F8F; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0">RA</span>
      <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 16px; font-weight: 700">Rafi <span style="font-size: 13px; font-weight: 500; color: #6B625C">· Friend</span></span><span style="font-size: 12px; color: #6B625C">1 loan · due 1 Dec</span></span>
      <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 1px"><span style="font-size: 11px; font-weight: 600; color: #1F6B45">Owes you</span><span style="font-size: 15px; font-weight: 800">৳ 2,000</span></span>
    </button>
    <button style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border: none; background: transparent; text-align: left; color: #1A1614">
      <span style="width: 44px; height: 44px; border-radius: 22px; background: #FBF1E3; color: #7A4A10; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0">TM</span>
      <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 16px; font-weight: 700">Tanim <span style="font-size: 13px; font-weight: 500; color: #6B625C">· Colleague</span></span><span style="font-size: 12px; color: #6B625C">1 loan · no due date</span></span>
      <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 1px"><span style="font-size: 11px; font-weight: 600; color: #B3261E">You owe</span><span style="font-size: 15px; font-weight: 800">৳ 500</span></span>
    </button>
  </div>

  <h2 style="margin: 6px 4px 0; font-size: 12px; font-weight: 700; color: #6B625C; letter-spacing: 0.8px; text-transform: uppercase">New person</h2>
  <section style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 14px; outline: 2px solid #1A1614; outline-offset: -2px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 10px 30px rgba(26,22,20,0.10)">
    <div style="display: flex; align-items: center; gap: 14px">
      <button aria-label="Change photo" style="position: relative; width: 64px; height: 64px; border-radius: 32px; border: none; background: #E3F1FA; color: #02598A; font-size: 22px; font-weight: 800; flex-shrink: 0">MA<span aria-hidden="true" style="position: absolute; right: -2px; bottom: -2px; width: 26px; height: 26px; border-radius: 13px; background: #1A1614; border: 2px solid #FFFFFF; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3"></circle></svg></span></button>
      <div style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1; min-width: 0">
        <label for="pname" style="position: absolute; left: -9999px">Name</label>
        <input id="pname" value="Mum" style="height: 44px; padding: 0 14px; border-radius: 14px; border: none; background: #F4F1EE; font-family: inherit; font-size: 16px; font-weight: 600; color: #1A1614; box-sizing: border-box; width: 100%">
        <label for="prel" style="position: absolute; left: -9999px">Relation</label>
        <input id="prel" placeholder="Relation — wife, son, friend" style="height: 44px; padding: 0 14px; border-radius: 14px; border: none; background: #F4F1EE; font-family: inherit; font-size: 15px; color: #1A1614; box-sizing: border-box; width: 100%">
      </div>
    </div>
    <div role="radiogroup" aria-label="Group" style="display: flex; height: 44px; padding: 4px; box-sizing: border-box; border-radius: 22px; background: #F0ECE8">
      <button role="radio" aria-checked="true" style="flex: 1; border: none; border-radius: 18px; background: #1A1614; color: #FFFFFF; font-size: 14px; font-weight: 700">Household</button>
      <button role="radio" aria-checked="false" style="flex: 1; border: none; border-radius: 18px; background: transparent; font-size: 14px; font-weight: 600; color: #5E5752">Contact</button>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="font-size: 14px; font-weight: 600; flex-grow: 1">Colour</span>
      <button aria-label="Sky, selected" aria-pressed="true" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: #0284C7; box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 5px #1A1614"></button>
      <button aria-label="Coral" aria-pressed="false" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: #F15F43"></button>
      <button aria-label="Indigo" aria-pressed="false" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: #5B7CE0"></button>
      <button aria-label="Moss" aria-pressed="false" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: #2D8657"></button>
      <button aria-label="Violet" aria-pressed="false" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: #9A6DD7"></button>
      <button aria-label="Amber" aria-pressed="false" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: #C38131"></button>
    </div>
    <div style="display: flex; gap: 8px">
      <button style="height: 48px; padding: 0 20px; border-radius: 24px; border: none; background: #F0ECE8; color: #1A1614; font-size: 15px; font-weight: 700">Cancel</button>
      <button style="flex-grow: 1; height: 48px; border-radius: 24px; border: none; background: #1A1614; color: #FFFFFF; font-size: 15px; font-weight: 700">Create</button>
    </div>
  </section>
</div>


</body>
</html>
