<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Note editor</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A5A1F}a:hover{color:#6A4314}
button{font-family:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #FFFFFF; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1A1614; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 16px">

  <header style="display: flex; align-items: center; gap: 8px">
    <a href="#" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #F4F1EE; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="flex-grow: 1; font-size: 13px; color: #6B625C; padding-left: 4px">Saved · edited 1h ago</span>
    <button aria-label="Lock note" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #F4F1EE; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2.5"></rect><path d="M8 11V8a4 4 0 0 1 7.5-2"></path></svg></button>
    <button aria-label="Unpin" aria-pressed="true" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #FCF4E6; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#A86C22"><path d="M9 3h6l-1 6 3 3v2h-4.2L12 21l-.8-7H7v-2l3-3z"></path></svg></button>
    <button aria-label="More: move to folder, export as PDF, share as text" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #F4F1EE; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#1A1614"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
  </header>

  <label for="ntitle" style="position: absolute; left: -9999px">Title</label>
  <input id="ntitle" value="Doctor questions" style="border: none; outline: none; background: transparent; font-family: inherit; font-size: 32px; font-weight: 800; letter-spacing: -1px; color: #1A1614; padding: 4px 0 0; width: 100%">

  <div style="display: flex; flex-wrap: wrap; gap: 6px">
    <button style="height: 36px; padding: 0 12px 0 10px; border-radius: 18px; border: none; background: #FCF4E6; color: #6E5530; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A5A1F" stroke-width="2.2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Health</button>
    <button style="height: 36px; padding: 0 12px; border-radius: 18px; border: none; background: #F4F1EE; color: #1A1614; font-size: 13px; font-weight: 600">#health</button>
    <button style="height: 36px; padding: 0 12px 0 10px; border-radius: 18px; border: none; background: #F4F1EE; color: #1A1614; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path></svg>Thu 9:00 AM</button>
    <button style="height: 36px; padding: 0 12px 0 8px; border-radius: 18px; border: 1.5px dashed #BFB7B0; background: transparent; color: #5E5752; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 4px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5E5752" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Tag</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; font-size: 17px; line-height: 1.5; color: #2A2523">
    <p style="margin: 0">Appointment is Thursday. Things to ask before the course ends:</p>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label style="display: flex; align-items: center; gap: 12px; min-height: 44px"><input type="checkbox" style="appearance: none; -webkit-appearance: none; width: 24px; height: 24px; margin: 0; border-radius: 8px; border: 2.5px solid #C9C2BC; box-sizing: border-box; flex-shrink: 0">Dosage after day 5 — keep going or stop?</label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 44px"><input type="checkbox" style="appearance: none; -webkit-appearance: none; width: 24px; height: 24px; margin: 0; border-radius: 8px; border: 2.5px solid #C9C2BC; box-sizing: border-box; flex-shrink: 0">Blood test results from last week</label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; color: #8C847F; text-decoration: line-through"><span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 8px; background: #2D8657; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span>Bring the old prescription</label>
    </div>
    <button style="align-self: flex-start; height: 44px; padding: 0 16px 0 12px; border-radius: 22px; border: none; background: #EAEFFD; color: #2E418A; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3B4F8F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M8.5 12.2l2.4 2.4 4.6-4.8"></path></svg>Convert 2 items to tasks</button>
    <p style="margin: 0">Omeprazole is <strong>before food</strong>, Napa <strong>after</strong>. Ask if they can be taken closer together in the morning.</p>
    <p style="margin: 0; color: #8C847F">Keep writing…<span aria-hidden="true" style="display: inline-block; width: 2px; height: 20px; background: #1A1614; vertical-align: -4px; margin-left: 2px"></span></p>
  </div>

  <div role="toolbar" aria-label="Formatting" style="position: absolute; left: 20px; right: 20px; bottom: 24px; height: 62px; border-radius: 31px; background: #1A1614; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; box-sizing: border-box; box-shadow: 0 14px 36px rgba(26,22,20,0.28)">
    <button aria-label="Bold" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: transparent; color: #FFFFFF; font-size: 18px; font-weight: 800">B</button>
    <button aria-label="Italic" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: transparent; color: #FFFFFF; font-size: 18px; font-weight: 600; font-style: italic">I</button>
    <button aria-label="Heading" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: transparent; color: #FFFFFF; font-size: 17px; font-weight: 800">H</button>
    <button aria-label="Checklist" aria-pressed="true" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"></rect><path d="M8.5 12.2l2.4 2.4 4.6-4.8"></path></svg></button>
    <button aria-label="Bullet list" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"></path></svg></button>
    <span aria-hidden="true" style="width: 1px; height: 24px; background: rgba(255,255,255,0.18)"></span>
    <button aria-label="Dictate" style="width: 46px; height: 46px; border-radius: 23px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg></button>
  </div>
</div>


</body>
</html>
