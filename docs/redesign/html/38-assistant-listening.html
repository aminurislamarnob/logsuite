<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assistant listening</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF7D63}a:hover{color:#FFA996}
button{font-family:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #14100F; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #FFFFFF; padding: 56px 20px 28px; display: flex; flex-direction: column; gap: 18px">

  <header style="display: flex; align-items: center; gap: 10px">
    <a href="#" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <h1 style="margin: 0 0 0 2px; font-size: 28px; font-weight: 800; letter-spacing: -0.8px; flex-grow: 1">Assistant</h1>
    <span style="height: 32px; padding: 0 12px; border-radius: 16px; background: rgba(255,255,255,0.08); font-size: 12px; font-weight: 700; color: #FFFFFF; display: flex; align-items: center; gap: 6px"><span style="width: 7px; height: 7px; border-radius: 4px; background: #56CE8E"></span>Claude</span>
    <a href="#" aria-label="AI settings" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg></a>
  </header>

  <div style="display: flex; flex-direction: column; gap: 6px; padding: 6px 4px 0">
    <span style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #FF7D63; letter-spacing: 1px; text-transform: uppercase"><span style="width: 8px; height: 8px; border-radius: 4px; background: #FF7D63"></span>Listening · 0:07</span>
    <h2 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.1">Say what you want to add</h2>
  </div>

  <section aria-label="Transcript so far" style="background: rgba(255,255,255,0.06); border-radius: 26px; padding: 18px; min-height: 132px; box-sizing: border-box">
    <p style="margin: 0; font-size: 20px; font-weight: 500; line-height: 29px; letter-spacing: -0.2px">Spent 200 taka on lunch with bKash, <span style="color: #A39B96">remind me to…</span><span aria-hidden="true" style="display: inline-block; width: 3px; height: 22px; border-radius: 2px; background: #FF7D63; vertical-align: -4px; margin-left: 3px"></span></p>
  </section>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 10px 0 0">
    <div role="img" aria-label="Live sound level" style="display: flex; align-items: center; justify-content: center; gap: 5px; height: 72px">
      <span style="width: 5px; height: 14px; border-radius: 3px; background: rgba(255,125,99,0.4)"></span>
      <span style="width: 5px; height: 26px; border-radius: 3px; background: rgba(255,125,99,0.55)"></span>
      <span style="width: 5px; height: 18px; border-radius: 3px; background: rgba(255,125,99,0.55)"></span>
      <span style="width: 5px; height: 40px; border-radius: 3px; background: rgba(255,125,99,0.75)"></span>
      <span style="width: 5px; height: 30px; border-radius: 3px; background: rgba(255,125,99,0.75)"></span>
      <span style="width: 5px; height: 56px; border-radius: 3px; background: #FF7D63"></span>
      <span style="width: 5px; height: 44px; border-radius: 3px; background: #FF7D63"></span>
      <span style="width: 5px; height: 68px; border-radius: 3px; background: #FF7D63"></span>
      <span style="width: 5px; height: 36px; border-radius: 3px; background: #FF7D63"></span>
      <span style="width: 5px; height: 60px; border-radius: 3px; background: #FF7D63"></span>
      <span style="width: 5px; height: 48px; border-radius: 3px; background: #FF7D63"></span>
      <span style="width: 5px; height: 24px; border-radius: 3px; background: #FF7D63"></span>
      <span style="width: 5px; height: 52px; border-radius: 3px; background: #FF7D63"></span>
      <span style="width: 5px; height: 34px; border-radius: 3px; background: rgba(255,125,99,0.75)"></span>
      <span style="width: 5px; height: 44px; border-radius: 3px; background: rgba(255,125,99,0.75)"></span>
      <span style="width: 5px; height: 20px; border-radius: 3px; background: rgba(255,125,99,0.55)"></span>
      <span style="width: 5px; height: 30px; border-radius: 3px; background: rgba(255,125,99,0.55)"></span>
      <span style="width: 5px; height: 12px; border-radius: 3px; background: rgba(255,125,99,0.4)"></span>
    </div>
    <button aria-label="Stop listening" style="width: 108px; height: 108px; border-radius: 54px; border: none; background: #FF7D63; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 12px rgba(255,125,99,0.16), 0 0 0 26px rgba(255,125,99,0.07)"><svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#14100F" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg></button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; margin-top: auto">
    <span style="font-size: 12px; font-weight: 700; color: #A39B96; letter-spacing: 0.8px; text-transform: uppercase; padding: 0 4px">Try saying</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <span style="height: 34px; padding: 0 12px; border-radius: 17px; background: rgba(255,255,255,0.06); font-size: 13px; color: #D9D3CE; display: flex; align-items: center">“Add Napa 3 times a day for 5 days”</span>
      <span style="height: 34px; padding: 0 12px; border-radius: 17px; background: rgba(255,255,255,0.06); font-size: 13px; color: #D9D3CE; display: flex; align-items: center">“Rickshaw 60 cash”</span>
      <span style="height: 34px; padding: 0 12px; border-radius: 17px; background: rgba(255,255,255,0.06); font-size: 13px; color: #D9D3CE; display: flex; align-items: center">“Rent Friday 9am”</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px">
    <button aria-label="Type instead" style="width: 58px; height: 58px; border-radius: 29px; border: none; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="3"></rect><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"></path></svg></button>
    <button aria-label="Scan instead" style="width: 58px; height: 58px; border-radius: 29px; border: none; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></button>
    <a href="#" style="flex-grow: 1; height: 58px; border-radius: 29px; background: #FFFFFF; color: #14100F; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px">Tap to send<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14100F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
  </div>
</div>


</body>
</html>
