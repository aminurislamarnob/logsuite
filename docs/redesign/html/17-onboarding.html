<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2401F}a:hover{color:#9A3016}
button{font-family:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F1EE; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1A1614; display: flex; flex-direction: column">

  <div style="position: relative; height: 372px; background: #1A1614; border-radius: 0 0 40px 40px; overflow: hidden; flex-shrink: 0">
    <div style="position: absolute; left: 20px; right: 20px; top: 56px; display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 20px; font-weight: 800; letter-spacing: -0.5px; color: #FFFFFF">log<span style="color: #FF7D63">Suite</span></span>
      <a href="#" style="height: 36px; padding: 0 14px; border-radius: 18px; background: rgba(255,255,255,0.10); color: #FFFFFF; font-size: 13px; font-weight: 700; text-decoration: none; display: flex; align-items: center">Skip</a>
    </div>
    <div aria-hidden="true" style="position: absolute; left: 28px; top: 120px; width: 196px; border-radius: 24px; background: #2A2422; padding: 16px; display: flex; align-items: center; gap: 14px; transform: rotate(-4deg); box-shadow: 0 16px 40px rgba(0,0,0,0.35)">
      <svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="8"></circle><circle cx="32" cy="32" r="26" fill="none" stroke="#FF7D63" stroke-width="8" stroke-linecap="round" stroke-dasharray="110 164" transform="rotate(-90 32 32)"></circle></svg>
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 26px; font-weight: 800; color: #FFFFFF; letter-spacing: -1px; line-height: 1">7<span style="font-size: 14px; font-weight: 600; color: #A39B96; letter-spacing: 0"> of 14</span></span><span style="font-size: 12px; color: #B5ADA8">done today</span></div>
    </div>
    <div aria-hidden="true" style="position: absolute; right: 22px; top: 190px; width: 200px; border-radius: 20px; background: #FFFFFF; padding: 12px; display: flex; align-items: center; gap: 12px; transform: rotate(3deg); box-shadow: 0 16px 40px rgba(0,0,0,0.35)">
      <span style="width: 40px; height: 40px; border-radius: 14px; background: #FFE7E0; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E24E32" stroke-width="2"><rect x="3.5" y="8.5" width="17" height="7" rx="3.5" transform="rotate(-40 12 12)"></rect><path d="M9.6 8.8l4.8 6.4"></path></svg></span>
      <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1"><span style="font-size: 14px; font-weight: 700; color: #1A1614">Napa 500 mg</span><span style="font-size: 11px; color: #6B625C">2:00 PM · after food</span></div>
      <span style="width: 28px; height: 28px; border-radius: 14px; background: #2D8657; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span>
    </div>
    <div aria-hidden="true" style="position: absolute; left: 44px; top: 268px; display: flex; gap: 8px; transform: rotate(-2deg)">
      <span style="height: 36px; padding: 0 14px 0 10px; border-radius: 18px; background: #F4EEFB; font-size: 13px; font-weight: 700; color: #1A1614; display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 24px rgba(0,0,0,0.3)"><span style="width: 8px; height: 8px; border-radius: 4px; background: #9A6DD7"></span>৳ 200 · Lunch</span>
      <span style="height: 36px; padding: 0 14px 0 10px; border-radius: 18px; background: #E6F4EC; font-size: 13px; font-weight: 700; color: #1A1614; display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 24px rgba(0,0,0,0.3)"><span style="width: 8px; height: 8px; border-radius: 4px; background: #2D8657"></span>12-day streak</span>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 28px 24px 28px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 36px; font-weight: 800; letter-spacing: -1.4px; line-height: 1.05">Your day,<br>in one place.</h1>
      <p style="margin: 0; font-size: 15px; color: #5E5752; line-height: 1.45">Tasks, medicine, habits, money, notes and focus. Turn on only what you need.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="name" style="font-size: 12px; font-weight: 700; color: #6B625C; letter-spacing: 0.8px; text-transform: uppercase; padding: 0 4px">Your name</label>
      <input id="name" placeholder="What should we call you?" style="height: 56px; padding: 0 18px; border-radius: 20px; border: none; outline: 2px solid #1A1614; outline-offset: -2px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #1A1614; box-sizing: border-box">
    </div>

    <div role="radiogroup" aria-label="Pick your language" style="display: flex; gap: 8px">
      <button role="radio" aria-checked="true" style="flex: 1; height: 48px; border-radius: 24px; border: none; background: #1A1614; color: #FFFFFF; font-size: 15px; font-weight: 700">English</button>
      <button role="radio" aria-checked="false" lang="bn" style="flex: 1; height: 48px; border-radius: 24px; border: none; background: #FFFFFF; color: #1A1614; font-size: 15px; font-weight: 600; box-shadow: 0 1px 2px rgba(26,22,20,0.05)">বাংলা</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px; margin-top: auto">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5E5752"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1F6B45" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"></path><path d="M9 12l2 2 4-4"></path></svg>Everything stays on this device. Nothing is uploaded.</div>
      <div style="display: flex; align-items: center; gap: 16px">
        <div role="img" aria-label="Step 1 of 3" style="display: flex; gap: 6px"><span style="width: 22px; height: 6px; border-radius: 3px; background: #1A1614"></span><span style="width: 6px; height: 6px; border-radius: 3px; background: #CFC8C2"></span><span style="width: 6px; height: 6px; border-radius: 3px; background: #CFC8C2"></span></div>
        <a href="#" style="flex-grow: 1; height: 58px; border-radius: 29px; background: #1A1614; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 12px 30px rgba(26,22,20,0.25)">Continue<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
      </div>
    </div>
  </div>
</div>


</body>
</html>
