<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit task</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3F5DB8}a:hover{color:#2E4790}
button{font-family:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #2B2522; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1A1614">

  <div aria-hidden="true" style="position: absolute; left: 20px; right: 20px; top: 34px; display: flex; align-items: center; gap: 12px; opacity: 0.18"><span style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF"></span><span style="width: 110px; height: 22px; border-radius: 11px; background: #FFFFFF"></span></div>

  <section aria-label="Edit task" style="position: absolute; left: 0; right: 0; bottom: 0; height: 764px; background: #F4F1EE; border-radius: 32px 32px 0 0; box-sizing: border-box; padding: 10px 20px 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -20px 60px rgba(0,0,0,0.35)">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D9D3CE"></div>

    <div style="display: flex; align-items: center; gap: 8px">
      <h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.6px; flex-grow: 1">Edit task</h1>
      <button aria-label="Delete task" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B3261E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"></path></svg></button>
      <a href="#" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>

    <div style="background: #FFFFFF; border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
      <label for="ttitle" style="position: absolute; left: -9999px">Title</label>
      <input id="ttitle" value="Call the doctor" style="border: none; outline: none; background: transparent; font-family: inherit; font-size: 22px; font-weight: 700; letter-spacing: -0.4px; color: #1A1614; padding: 0; min-width: 0">
      <label for="tdesc" style="position: absolute; left: -9999px">Description</label>
      <input id="tdesc" value="Ask about the blood test and day-5 dosage" style="border: none; outline: none; background: transparent; font-family: inherit; font-size: 14px; color: #5E5752; padding: 0; min-width: 0">
    </div>

    <div style="background: #FFFFFF; border-radius: 22px; padding: 0 14px; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
      <button style="display: flex; align-items: center; gap: 12px; height: 50px; border: none; border-bottom: 1px solid #F0ECE8; background: transparent; padding: 0; text-align: left; color: #1A1614"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A67C4" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg><span style="flex-grow: 1; font-size: 15px; font-weight: 600">Due</span><span style="font-size: 14px; font-weight: 700">Today · 5:00 PM</span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A39B96" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
      <button style="display: flex; align-items: center; gap: 12px; height: 50px; border: none; border-bottom: 1px solid #F0ECE8; background: transparent; padding: 0; text-align: left; color: #1A1614"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A67C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20.5a2 2 0 0 0 4 0"></path></svg><span style="flex-grow: 1; font-size: 15px; font-weight: 600">Reminder</span><span style="font-size: 14px; font-weight: 700">4:45 PM</span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A39B96" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
      <button style="display: flex; align-items: center; gap: 12px; height: 50px; border: none; background: transparent; padding: 0; text-align: left; color: #1A1614"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A67C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h13l-3.5-3.5M19 15H6l3.5 3.5"></path></svg><span style="flex-grow: 1; font-size: 15px; font-weight: 600">Repeat</span><span style="font-size: 14px; color: #6B625C">Does not repeat</span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A39B96" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; color: #6B625C; letter-spacing: 0.8px; text-transform: uppercase; padding: 0 4px">Priority</span>
      <div role="radiogroup" aria-label="Priority" style="display: flex; gap: 8px">
        <button role="radio" aria-checked="false" style="flex: 1; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; font-size: 14px; font-weight: 700; color: #B3261E; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 1px 2px rgba(26,22,20,0.05)"><span style="width: 8px; height: 8px; border-radius: 4px; background: #B3261E"></span>P1</button>
        <button role="radio" aria-checked="true" style="flex: 1; height: 44px; border-radius: 22px; border: none; background: #1A1614; font-size: 14px; font-weight: 700; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #FFB95C"></span>P2</button>
        <button role="radio" aria-checked="false" style="flex: 1; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; font-size: 14px; font-weight: 700; color: #3B4F8F; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 1px 2px rgba(26,22,20,0.05)"><span style="width: 8px; height: 8px; border-radius: 4px; background: #4A67C4"></span>P3</button>
        <button role="radio" aria-checked="false" style="flex: 1; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; font-size: 14px; font-weight: 700; color: #5E5752; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 1px 2px rgba(26,22,20,0.05)"><span style="width: 8px; height: 8px; border-radius: 4px; background: #A39B96"></span>P4</button>
      </div>
    </div>

    <div style="display: flex; gap: 8px">
      <button style="white-space: nowrap; height: 44px; padding: 0 14px 0 12px; border-radius: 22px; border: none; background: #FFFFFF; font-size: 14px; font-weight: 600; color: #1A1614; display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 2px rgba(26,22,20,0.05)"><span style="width: 10px; height: 10px; border-radius: 5px; background: #2D8657"></span>Health</button>
      <button style="white-space: nowrap; height: 44px; padding: 0 14px; border-radius: 22px; border: none; background: #FFFFFF; font-size: 14px; font-weight: 600; color: #1A1614; box-shadow: 0 1px 2px rgba(26,22,20,0.05)">#doctor</button>
      <button style="white-space: nowrap; height: 44px; padding: 0 14px 0 12px; border-radius: 22px; border: none; background: #FFFFFF; font-size: 14px; font-weight: 600; color: #1A1614; display: flex; align-items: center; gap: 6px; box-shadow: 0 1px 2px rgba(26,22,20,0.05)"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E5752" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>15 min</button>
      <button aria-label="Add a tag" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px dashed #BDB5AF; background: transparent; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E5752" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
    </div>

    <div style="background: #FFFFFF; border-radius: 22px; padding: 4px 14px; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
      <div style="display: flex; align-items: center; gap: 12px; height: 44px; border-bottom: 1px solid #F0ECE8"><span style="width: 22px; height: 22px; border-radius: 11px; background: #2D8657; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span><span style="font-size: 14px; color: #6B625C; text-decoration: line-through">Find the clinic number</span></div>
      <div style="display: flex; align-items: center; gap: 12px; height: 44px; border-bottom: 1px solid #F0ECE8"><span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #C9C2BC; box-sizing: border-box; flex-shrink: 0"></span><span style="font-size: 14px; font-weight: 600">Bring last prescription</span></div>
      <div style="display: flex; align-items: center; gap: 12px; height: 44px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B625C" stroke-width="2.2" stroke-linecap="round"><path d="M12 6v12M6 12h12"></path></svg><label for="sub" style="position: absolute; left: -9999px">Add a subtask</label><input id="sub" placeholder="Add a subtask" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 14px; color: #1A1614"></div>
    </div>

    <button style="height: 58px; margin-top: auto; border-radius: 29px; border: none; background: #1A1614; color: #FFFFFF; font-size: 17px; font-weight: 700; box-shadow: 0 12px 30px rgba(26,22,20,0.25)">Save</button>
  </section>
</div>


</body>
</html>
