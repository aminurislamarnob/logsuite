<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Backup and restore</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2401F}a:hover{color:#9A3016}
button{font-family:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 880px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F1EE; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1A1614; padding: 56px 20px 28px; display: flex; flex-direction: column; gap: 12px">

  <header style="display: flex; align-items: center; gap: 10px">
    <a href="#" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0 0 0 2px; font-size: 28px; font-weight: 800; letter-spacing: -0.8px; flex-grow: 1">Data</h1>
  </header>

  <section aria-label="Backup" style="background: #1A1614; color: #FFFFFF; border-radius: 28px; padding: 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 16px 40px rgba(26,22,20,0.22)">
    <div style="display: flex; align-items: flex-start; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 12px; font-weight: 700; color: #FF7D63; letter-spacing: 1px; text-transform: uppercase">Last backup</span>
        <span style="font-size: 32px; font-weight: 800; letter-spacing: -1px; line-height: 1.05">5 days ago</span>
        <span style="font-size: 14px; color: #B5ADA8">12 Nov · 1.8 MB · 412 entries</span>
      </div>
      <span style="width: 48px; height: 48px; border-radius: 16px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"></path><path d="M9 12l2 2 4-4"></path></svg></span>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <span style="height: 28px; padding: 0 10px; border-radius: 14px; background: rgba(255,255,255,0.08); font-size: 12px; font-weight: 600; display: flex; align-items: center">Every module</span>
      <span style="height: 28px; padding: 0 10px; border-radius: 14px; background: rgba(255,255,255,0.08); font-size: 12px; font-weight: 600; display: flex; align-items: center">People &amp; photos</span>
      <span style="height: 28px; padding: 0 10px; border-radius: 14px; background: rgba(255,255,255,0.08); font-size: 12px; font-weight: 600; display: flex; align-items: center">One JSON file</span>
    </div>
    <button style="height: 54px; border-radius: 27px; border: none; background: #FFFFFF; color: #1A1614; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"></path></svg>Share a full backup</button>
  </section>

  <section style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 44px; height: 44px; border-radius: 16px; background: #E3F1FA; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#02598A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></span>
      <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 17px; font-weight: 700">Restore from a backup</span><span style="font-size: 13px; color: #6B625C">Pick a logSuite backup file</span></span>
    </div>
    <div style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 14px; background: #FBF1E3; font-size: 13px; font-weight: 600; color: #7A4A10; line-height: 1.4"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A35E12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><path d="M12 4l9 16H3z"></path><path d="M12 10v4M12 17h.01"></path></svg><span>Replaces everything on this device. The file is checked in full first, so a damaged one changes nothing.</span></div>
    <button style="height: 48px; border-radius: 24px; border: none; background: #F0ECE8; color: #1A1614; font-size: 15px; font-weight: 700">Choose a file</button>
  </section>

  <h2 style="margin: 6px 4px 0; font-size: 12px; font-weight: 700; color: #6B625C; letter-spacing: 0.8px; text-transform: uppercase">Export</h2>
  <div style="background: #FFFFFF; border-radius: 22px; padding: 2px 14px; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
    <button style="display: flex; align-items: center; gap: 12px; height: 60px; border: none; border-bottom: 1px solid #F0ECE8; background: transparent; text-align: left; color: #1A1614"><span style="width: 36px; height: 36px; border-radius: 12px; background: #F4EEFB; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6A41A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h8l4 4V20.500H6z"></path><path d="M9 13h6M9 16.500h4"></path></svg></span><span style="flex-grow: 1; font-size: 15px; font-weight: 600">This month as PDF</span><span style="font-size: 13px; color: #6B625C">Expenses</span></button>
    <button style="display: flex; align-items: center; gap: 12px; height: 60px; border: none; background: transparent; text-align: left; color: #1A1614"><span style="width: 36px; height: 36px; border-radius: 12px; background: #F4EEFB; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6A41A8" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="14" rx="2.500"></rect><path d="M4 10h16M4 14.500h16M10 5v14"></path></svg></span><span style="flex-grow: 1; font-size: 15px; font-weight: 600">Transactions as CSV</span><span style="font-size: 13px; color: #6B625C">64 rows</span></button>
  </div>

  <button style="display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 14px; border-radius: 22px; border: none; background: #FFFFFF; text-align: left; color: #B3261E; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06); margin-top: 4px"><span style="width: 36px; height: 36px; border-radius: 12px; background: #FDECEA; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B3261E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 9-5.200M18 11v5l1.500 2h-13M4 4l16 16"></path></svg></span><span style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1"><span style="font-size: 15px; font-weight: 700">Clear all scheduled reminders</span><span style="font-size: 12px; color: #6B625C">7 scheduled · your data is kept</span></span></button>
</div>


</body>
</html>
