<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Budgets</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6A41A8}a:hover{color:#4F2F82}
button{font-family:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 930px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F1EE; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1A1614; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 14px">

  <header style="display: flex; align-items: center; gap: 10px">
    <a href="#" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0 0 0 2px; font-size: 28px; font-weight: 800; letter-spacing: -0.8px; flex-grow: 1">Expenses</h1>
    <button aria-label="Change month" style="height: 44px; padding: 0 12px 0 14px; border-radius: 22px; border: none; background: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: #1A1614; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)">Nov<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8C847F" stroke-width="2.4" stroke-linecap="round"><path d="M7 10l5 5 5-5"></path></svg></button>
    <button aria-label="Export and categories" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#1A1614"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
  </header>

  <div role="tablist" aria-label="Sections" style="display: flex; height: 44px; padding: 4px; box-sizing: border-box; border-radius: 22px; background: #E8E3DF">
    <a href="#" role="tab" aria-selected="false" style="flex: 1.2; border-radius: 18px; font-size: 13px; font-weight: 600; color: #5E5752; text-decoration: none; display: flex; align-items: center; justify-content: center">Overview</a>
    <a href="#" role="tab" aria-selected="false" style="flex: 1.1; border-radius: 18px; font-size: 13px; font-weight: 600; color: #5E5752; text-decoration: none; display: flex; align-items: center; justify-content: center">Reports</a>
    <button role="tab" aria-selected="true" style="flex: 1.1; border: none; border-radius: 18px; background: #1A1614; color: #FFFFFF; font-size: 13px; font-weight: 700">Budgets</button>
    <a href="#" role="tab" aria-selected="false" style="flex: 0.8; border-radius: 18px; font-size: 13px; font-weight: 600; color: #5E5752; text-decoration: none; display: flex; align-items: center; justify-content: center">Bills</a>
    <a href="#" role="tab" aria-selected="false" style="flex: 0.9; border-radius: 18px; font-size: 13px; font-weight: 600; color: #5E5752; text-decoration: none; display: flex; align-items: center; justify-content: center">Loans</a>
  </div>

  <section aria-label="Overall budget" style="background: #1A1614; color: #FFFFFF; border-radius: 28px; padding: 20px; display: flex; align-items: center; gap: 18px; box-shadow: 0 16px 40px rgba(26,22,20,0.22)">
    <div style="position: relative; width: 92px; height: 92px; flex-shrink: 0">
      <svg role="img" aria-label="61 percent of the overall budget used" width="92" height="92" viewBox="0 0 92 92"><circle cx="46" cy="46" r="38" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="10"></circle><circle cx="46" cy="46" r="38" fill="none" stroke="#B58DEC" stroke-width="10" stroke-linecap="round" stroke-dasharray="145.6 239" transform="rotate(-90 46 46)"></circle></svg>
      <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; letter-spacing: -0.5px">61%</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
      <div style="display: flex; align-items: center; justify-content: space-between"><span style="font-size: 12px; font-weight: 700; color: #B58DEC; letter-spacing: 1px; text-transform: uppercase">Overall</span><span style="height: 24px; padding: 0 8px; border-radius: 12px; background: rgba(86,206,142,0.16); color: #7EE0AC; font-size: 11px; font-weight: 700; display: flex; align-items: center">On track</span></div>
      <span style="font-size: 26px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.1">৳ 11,550 <span style="font-size: 14px; font-weight: 600; color: #A39B96; letter-spacing: 0">left</span></span>
      <span style="font-size: 13px; color: #B5ADA8">৳ 18,450 of ৳ 30,000 · ৳ 888 a day</span>
    </div>
  </section>

  <section style="background: #FFFFFF; border-radius: 24px; padding: 6px 16px; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
    <button style="display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border: none; border-bottom: 1px solid #F0ECE8; background: transparent; text-align: left; color: #1A1614">
      <span style="display: flex; align-items: baseline; gap: 8px; width: 100%"><span style="font-size: 16px; font-weight: 700; flex-grow: 1">Food</span><span style="font-size: 14px; font-weight: 700">৳ 6,200 <span style="font-weight: 500; color: #6B625C">/ 8,000</span></span></span>
      <span style="display: block; width: 100%; height: 8px; border-radius: 4px; background: #F0ECE8"><span style="display: block; width: 77.5%; height: 8px; border-radius: 4px; background: #7E52BE"></span></span>
      <span style="font-size: 12px; color: #6B625C">৳ 1,800 left · 13 days to go</span>
    </button>
    <button style="display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border: none; border-bottom: 1px solid #F0ECE8; background: transparent; text-align: left; color: #1A1614">
      <span style="display: flex; align-items: baseline; gap: 8px; width: 100%"><span style="font-size: 16px; font-weight: 700; flex-grow: 1">Transport</span><span style="font-size: 14px; font-weight: 700">৳ 2,300 <span style="font-weight: 500; color: #6B625C">/ 2,500</span></span></span>
      <span style="display: block; width: 100%; height: 8px; border-radius: 4px; background: #F0ECE8"><span style="display: block; width: 92%; height: 8px; border-radius: 4px; background: #D98A2B"></span></span>
      <span style="font-size: 12px; font-weight: 700; color: #8A5A1F">Almost there · ৳ 200 left</span>
    </button>
    <button style="display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border: none; background: transparent; text-align: left; color: #1A1614">
      <span style="display: flex; align-items: baseline; gap: 8px; width: 100%"><span style="font-size: 16px; font-weight: 700; flex-grow: 1">Shopping</span><span style="font-size: 14px; font-weight: 700">৳ 3,400 <span style="font-weight: 500; color: #6B625C">/ 3,000</span></span></span>
      <span style="display: block; width: 100%; height: 8px; border-radius: 4px; background: #F0ECE8"><span style="display: block; width: 100%; height: 8px; border-radius: 4px; background: #D34247"></span></span>
      <span style="font-size: 12px; font-weight: 700; color: #B3261E">৳ 400 over</span>
    </button>
  </section>

  <section style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 2px 4px 0">
      <h2 style="margin: 0; font-size: 12px; font-weight: 700; color: #6B625C; letter-spacing: 0.8px; text-transform: uppercase">Not budgeted</h2>
      <span style="font-size: 13px; color: #6B625C">৳ 6,550 uncapped</span>
    </div>
    <div style="background: #FFFFFF; border-radius: 22px; padding: 2px 8px 2px 16px; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
      <div style="display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid #F0ECE8"><span style="flex-grow: 1; font-size: 15px; font-weight: 600">Bills</span><span style="font-size: 14px; font-weight: 700">৳ 4,100</span><button style="height: 44px; padding: 0 12px; border-radius: 22px; border: none; background: transparent; font-size: 13px; font-weight: 700; color: #6A41A8">Set a budget</button></div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid #F0ECE8"><span style="flex-grow: 1; font-size: 15px; font-weight: 600">Health</span><span style="font-size: 14px; font-weight: 700">৳ 1,140</span><button style="height: 44px; padding: 0 12px; border-radius: 22px; border: none; background: transparent; font-size: 13px; font-weight: 700; color: #6A41A8">Set a budget</button></div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 6px 0"><span style="flex-grow: 1; font-size: 15px; font-weight: 600">Groceries</span><span style="font-size: 14px; font-weight: 700">৳ 1,310</span><button style="height: 44px; padding: 0 12px; border-radius: 22px; border: none; background: transparent; font-size: 13px; font-weight: 700; color: #6A41A8">Set a budget</button></div>
    </div>
  </section>

  <button style="height: 56px; border-radius: 28px; border: none; background: #1A1614; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px; box-shadow: 0 12px 30px rgba(26,22,20,0.25)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add a budget</button>
</div>


</body>
</html>
