<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Focus</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#59C2CC}a:hover{color:#8ADBE3}
button{font-family:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #14100F; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #FFFFFF; padding: 56px 20px 28px; display: flex; flex-direction: column; gap: 18px">

  <header style="display: flex; align-items: center; gap: 10px">
    <a href="#" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0 0 0 2px; font-size: 28px; font-weight: 800; letter-spacing: -0.8px; flex-grow: 1">Focus</h1>
    <button aria-label="Focus stats" style="height: 44px; padding: 0 16px 0 12px; border-radius: 22px; border: none; background: rgba(255,255,255,0.08); color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9"></path></svg>Stats</button>
  </header>

  <div role="tablist" aria-label="Mode" style="align-self: center; display: flex; height: 40px; padding: 4px; box-sizing: border-box; border-radius: 20px; background: rgba(255,255,255,0.08)">
    <button role="tab" aria-selected="true" style="padding: 0 18px; border: none; border-radius: 16px; background: #FFFFFF; color: #14100F; font-size: 13px; font-weight: 700">Focus</button>
    <button role="tab" aria-selected="false" style="padding: 0 18px; border: none; border-radius: 16px; background: transparent; color: #B5ADA8; font-size: 13px; font-weight: 600">Break</button>
    <button role="tab" aria-selected="false" style="padding: 0 18px; border: none; border-radius: 16px; background: transparent; color: #B5ADA8; font-size: 13px; font-weight: 600">Flow</button>
  </div>

  <div style="position: relative; width: 290px; height: 290px; align-self: center; margin: 6px 0">
    <svg role="img" aria-label="18 minutes 24 seconds left of 25" width="290" height="290" viewBox="0 0 290 290"><circle cx="145" cy="145" r="132" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="14"></circle><circle cx="145" cy="145" r="132" fill="none" stroke="#59C2CC" stroke-width="14" stroke-linecap="round" stroke-dasharray="219 829.4" transform="rotate(-90 145 145)"></circle><circle cx="276.5" cy="156.5" r="11" fill="#14100F" stroke="#59C2CC" stroke-width="5"></circle></svg>
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
      <span style="font-size: 12px; font-weight: 700; color: #59C2CC; letter-spacing: 1.2px; text-transform: uppercase">Session 2 of 4</span>
      <span style="font-size: 76px; font-weight: 800; letter-spacing: -3.5px; line-height: 1">18:24</span>
      <span style="font-size: 14px; color: #B5ADA8">of 25 min · ends 2:43 PM</span>
    </div>
  </div>

  <button style="align-self: center; height: 44px; padding: 0 16px 0 12px; border-radius: 22px; border: none; background: rgba(255,255,255,0.08); color: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px"><span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #7E9CF6; box-sizing: border-box"></span>Finish design review<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A39B96" stroke-width="2.4" stroke-linecap="round"><path d="M7 10l5 5 5-5"></path></svg></button>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 12px; font-weight: 700; color: #A39B96; letter-spacing: 0.8px; text-transform: uppercase; padding: 0 4px">Ambient sound</span>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
      <button aria-pressed="true" style="display: flex; flex-direction: column; align-items: center; gap: 6px; border: none; background: transparent; padding: 0; color: #FFFFFF"><span style="width: 48px; height: 48px; border-radius: 24px; background: #59C2CC; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14100F" stroke-width="2.2" stroke-linecap="round"><path d="M6 14a6 6 0 1 1 11.5-2.5A4 4 0 0 1 17 14zM8 18l-1 3M12 18l-1 3M16 18l-1 3"></path></svg></span><span style="font-size: 11px; font-weight: 700">Rain</span></button>
      <button aria-pressed="false" style="display: flex; flex-direction: column; align-items: center; gap: 6px; border: none; background: transparent; padding: 0; color: #B5ADA8"><span style="width: 48px; height: 48px; border-radius: 24px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"><path d="M12 3l6 9h-3l4 6H5l4-6H6zM12 18v3"></path></svg></span><span style="font-size: 11px; font-weight: 600">Forest</span></button>
      <button aria-pressed="false" style="display: flex; flex-direction: column; align-items: center; gap: 6px; border: none; background: transparent; padding: 0; color: #B5ADA8"><span style="width: 48px; height: 48px; border-radius: 24px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><path d="M3 9c3-3 5 3 9 0s6 3 9 0M3 15c3-3 5 3 9 0s6 3 9 0"></path></svg></span><span style="font-size: 11px; font-weight: 600">Ocean</span></button>
      <button aria-pressed="false" style="display: flex; flex-direction: column; align-items: center; gap: 6px; border: none; background: transparent; padding: 0; color: #B5ADA8"><span style="width: 48px; height: 48px; border-radius: 24px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5zM16 10h2a2 2 0 0 1 0 4h-2M9 3v3M12 3v3"></path></svg></span><span style="font-size: 11px; font-weight: 600">Café</span></button>
      <button aria-pressed="false" style="display: flex; flex-direction: column; align-items: center; gap: 6px; border: none; background: transparent; padding: 0; color: #B5ADA8"><span style="width: 48px; height: 48px; border-radius: 24px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"></path></svg></span><span style="font-size: 11px; font-weight: 600">White</span></button>
      <button aria-pressed="false" style="display: flex; flex-direction: column; align-items: center; gap: 6px; border: none; background: transparent; padding: 0; color: #B5ADA8"><span style="width: 48px; height: 48px; border-radius: 24px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><path d="M4 11v2M8 9v6M12 6v12M16 9v6M20 11v2"></path></svg></span><span style="font-size: 11px; font-weight: 600">Brown</span></button>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: auto">
    <button aria-label="Reset" style="width: 56px; height: 56px; border-radius: 28px; border: none; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v4.5h4.5"></path></svg></button>
    <button aria-label="Pause" style="width: 84px; height: 84px; border-radius: 42px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="#14100F"><rect x="6" y="5" width="4.5" height="14" rx="1.5"></rect><rect x="13.5" y="5" width="4.5" height="14" rx="1.5"></rect></svg></button>
    <button aria-label="Finish session" style="width: 56px; height: 56px; border-radius: 28px; border: none; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></button>
  </div>

  <div style="display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 20px; background: rgba(255,255,255,0.06)">
    <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
      <span style="font-size: 13px; font-weight: 600">45m of 2h goal today</span>
      <div style="height: 5px; border-radius: 3px; background: rgba(255,255,255,0.12)"><div style="width: 38%; height: 5px; border-radius: 3px; background: #59C2CC"></div></div>
    </div>
    <span style="display: flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 800"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="#FFB95C"><path d="M12 22c-4.4 0-7-2.8-7-6.5 0-4.3 3.8-6.5 4.3-11 2.7 1.6 3.8 4.3 3.8 6.5 1.1-.6 2.2-1.9 2.4-3.3 2 2 3.5 4.6 3.5 7.6 0 3.9-2.6 6.7-7 6.7z"></path></svg>6 days</span>
  </div>
</div>


</body>
</html>
