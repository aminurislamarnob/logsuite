<style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #2B2522; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1A1614">

  <div aria-hidden="true" style="position: absolute; left: 20px; right: 20px; top: 40px; display: flex; align-items: center; gap: 12px; opacity: 0.18"><span style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF"></span><span style="width: 120px; height: 22px; border-radius: 11px; background: #FFFFFF"></span></div>

  <section aria-label="Read 20 pages" style="position: absolute; left: 0; right: 0; bottom: 0; height: 740px; background: #F4F1EE; border-radius: 32px 32px 0 0; box-sizing: border-box; padding: 10px 20px 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -20px 60px rgba(0,0,0,0.35)">

    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 52px; height: 52px; border-radius: 18px; background: #FBF1E3; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#A86C22" stroke-width="2" stroke-linejoin="round"><path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"></path></svg></span>

        <span style="font-size: 13px; color: #6B625C">Daily · reminder 9:30 PM</span>
      </div>
      <a href="#" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>

        <span style="background: #6DB78F"></span><span style="background: #BFE3CE"></span><span style="background: #BFE3CE"></span><span style="background: #6DB78F"></span><span style="background: #EFEAE6"></span><span style="background: #BFE3CE"></span><span style="background: #6DB78F"></span>

        <span style="background: #BFE3CE"></span><span style="background: #6DB78F"></span><span style="background: #6DB78F"></span><span style="background: #6DB78F"></span><span style="background: #2D8657"></span><span style="background: #6DB78F"></span><span style="background: #EFEAE6"></span>
        <span style="background: #6DB78F"></span><span style="background: #2D8657"></span><span style="background: #6DB78F"></span><span style="background: #6DB78F"></span><span style="background: #6DB78F"></span><span style="background: #EFEAE6"></span><span style="background: #6DB78F"></span>

        <span style="background: #2D8657"></span><span style="background: #6DB78F"></span><span style="background: #2D8657"></span><span style="background: #2D8657"></span><span style="background: #2D8657"></span><span style="background: #6DB78F"></span><span style="background: #2D8657"></span>
        <span style="background: #2D8657"></span><span style="background: #2D8657"></span><span style="background: #2D8657"></span><span style="background: #2D8657"></span><span style="background: #EFEAE6"></span><span style="background: #2D8657"></span><span style="background: #2D8657"></span>
        <span style="background: #2D8657"></span><span style="background: #2D8657"></span><span style="background: #2D8657"></span><span style="background: #2D8657"></span><span style="background: #2D8657"></span><span style="background: #2D8657"></span><span style="background: #6DB78F"></span>

        <span style="background: #2D8657"></span><span style="background: #2D8657"></span><span style="background: #2D8657"></span><span style="background: #2D8657"></span><span style="background: #2D8657"></span><span style="background: #2D8657"></span><span style="background: #2D8657"></span>

      </div>
      <div aria-hidden="true" style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: #6B625C"><span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span><span>Nov</span></div>

    <div style="display: flex; align-items: center; gap: 10px; margin-top: auto">
      <button aria-label="Delete habit" style="width: 58px; height: 58px; border-radius: 29px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.08)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B3261E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"></path></svg></button>
      <a href="#" style="flex-grow: 1; height: 58px; border-radius: 29px; background: #1A1614; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 12px 30px rgba(26,22,20,0.25)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L19 8l-3-3L5 16z"></path></svg>Edit habit</a>
