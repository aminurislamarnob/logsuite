<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accounts</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6A41A8}a:hover{color:#4F2F82}
button{font-family:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #2B2522; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1A1614">

  <div aria-hidden="true" style="position: absolute; left: 20px; right: 20px; top: 44px; display: flex; align-items: center; gap: 12px; opacity: 0.18"><span style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF"></span><span style="width: 150px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></div>

  <section aria-label="Accounts" style="position: absolute; left: 0; right: 0; bottom: 0; height: 756px; background: #F4F1EE; border-radius: 32px 32px 0 0; box-sizing: border-box; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -20px 60px rgba(0,0,0,0.35)">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D9D3CE"></div>

    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.8px">Accounts</h1>
        <span style="font-size: 14px; color: #6B625C">Total <span style="font-weight: 800; color: #1A1614">৳ 70,260</span> across 4</span>
      </div>
      <a href="#" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>

    <div style="background: #FFFFFF; border-radius: 24px; padding: 2px 6px 2px 14px; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
      <div style="display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #F0ECE8">
        <span style="width: 40px; height: 40px; border-radius: 14px; background: #E6F4EC; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F6B45" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6.5" width="18" height="11" rx="2.5"></rect><circle cx="12" cy="12" r="2.5"></circle></svg></span>
        <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1"><span style="font-size: 16px; font-weight: 700">Cash</span><span style="font-size: 12px; color: #6B625C">Default for new expenses</span></div>
        <span style="font-size: 16px; font-weight: 800">৳ 2,300</span>
        <button aria-label="Edit Cash" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B625C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L19 8l-3-3L5 16z"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #F0ECE8">
        <span style="width: 40px; height: 40px; border-radius: 14px; background: #F4EEFB; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7E52BE" stroke-width="2" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"></rect><path d="M11 18h2" stroke-linecap="round"></path></svg></span>
        <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1"><span style="font-size: 16px; font-weight: 700">bKash</span><span style="font-size: 12px; color: #6B625C">Mobile wallet</span></div>
        <span style="font-size: 16px; font-weight: 800">৳ 5,120</span>
        <button aria-label="Edit bKash" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B625C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L19 8l-3-3L5 16z"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #F0ECE8">
        <span style="width: 40px; height: 40px; border-radius: 14px; background: #F4EEFB; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7E52BE" stroke-width="2" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"></rect><path d="M11 18h2" stroke-linecap="round"></path></svg></span>
        <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1"><span style="font-size: 16px; font-weight: 700">Nagad</span><span style="font-size: 12px; color: #6B625C">Mobile wallet</span></div>
        <span style="font-size: 16px; font-weight: 800">৳ 840</span>
        <button aria-label="Edit Nagad" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B625C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L19 8l-3-3L5 16z"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 8px 0">
        <span style="width: 40px; height: 40px; border-radius: 14px; background: #EAEFFD; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3B4F8F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 9.5L12 4l9 5.5M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"></path></svg></span>
        <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1"><span style="font-size: 16px; font-weight: 700">Bank</span><span style="font-size: 12px; color: #6B625C">Salary lands here</span></div>
        <span style="font-size: 16px; font-weight: 800">৳ 62,000</span>
        <button aria-label="Edit Bank" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B625C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L19 8l-3-3L5 16z"></path></svg></button>
      </div>
    </div>

    <div style="display: flex; gap: 8px">
      <button style="flex: 1; height: 48px; border-radius: 24px; border: 1.5px dashed #BDB5AF; background: transparent; font-size: 14px; font-weight: 700; color: #1A1614; display: flex; align-items: center; justify-content: center; gap: 6px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add account</button>
      <button style="height: 48px; padding: 0 18px; border-radius: 24px; border: none; background: transparent; font-size: 14px; font-weight: 600; color: #5E5752">Archived · 1</button>
    </div>

    <section aria-label="Transfer money" style="background: #1A1614; color: #FFFFFF; border-radius: 26px; padding: 18px; display: flex; flex-direction: column; gap: 14px; margin-top: auto; box-shadow: 0 16px 40px rgba(26,22,20,0.25)">
      <span style="font-size: 12px; font-weight: 700; color: #B58DEC; letter-spacing: 1px; text-transform: uppercase">Transfer</span>
      <div style="display: flex; align-items: center; gap: 8px">
        <button style="flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 14px; border-radius: 18px; border: none; background: rgba(255,255,255,0.08); color: #FFFFFF; text-align: left"><span style="font-size: 11px; color: #B5ADA8">From</span><span style="font-size: 16px; font-weight: 700">bKash</span><span style="font-size: 12px; color: #B5ADA8">৳ 5,120</span></button>
        <button aria-label="Swap accounts" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #B58DEC; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
        <button style="flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 14px; border-radius: 18px; border: none; background: rgba(255,255,255,0.08); color: #FFFFFF; text-align: left"><span style="font-size: 11px; color: #B5ADA8">To</span><span style="font-size: 16px; font-weight: 700">Cash</span><span style="font-size: 12px; color: #B5ADA8">৳ 2,300</span></button>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <label for="amt" style="position: absolute; left: -9999px">Amount to transfer</label>
        <div style="flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 6px; height: 52px; padding: 0 16px; border-radius: 26px; background: rgba(255,255,255,0.08)"><span style="font-size: 18px; font-weight: 600; color: #B5ADA8">৳</span><input id="amt" value="500" inputmode="decimal" size="4" style="flex: 1 1 0; width: 0; min-width: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 20px; font-weight: 800; color: #FFFFFF"></div>
        <button style="height: 52px; padding: 0 22px; border-radius: 26px; border: none; background: #FFFFFF; color: #1A1614; font-size: 15px; font-weight: 700; flex-shrink: 0">Transfer</button>
      </div>
    </section>
  </section>
</div>


</body>
</html>
