<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assistant</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2401F}a:hover{color:#9A3016}
button{font-family:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F1EE; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1A1614; padding: 56px 20px 28px; display: flex; flex-direction: column; gap: 14px">

  <header style="display: flex; align-items: center; gap: 10px">
    <a href="#" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <h1 style="margin: 0 0 0 2px; font-size: 28px; font-weight: 800; letter-spacing: -0.8px; flex-grow: 1">Assistant</h1>
    <span style="height: 32px; padding: 0 12px; border-radius: 16px; background: #FFFFFF; font-size: 12px; font-weight: 700; color: #5E5752; display: flex; align-items: center; gap: 6px; box-shadow: 0 1px 2px rgba(26,22,20,0.05)"><span style="width: 7px; height: 7px; border-radius: 4px; background: #2D8657"></span>Claude</span>
    <a href="#" aria-label="AI settings" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg></a>
  </header>

  <section aria-label="What you said" style="background: #1A1614; color: #FFFFFF; border-radius: 26px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 16px 40px rgba(26,22,20,0.22)">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #FF7D63; letter-spacing: 0.8px; text-transform: uppercase"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF7D63" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg>You said</span>
      <button style="height: 32px; padding: 0 12px; border-radius: 16px; border: none; background: rgba(255,255,255,0.10); color: #FFFFFF; font-size: 12px; font-weight: 700">Edit text</button>
    </div>
    <p style="margin: 0; font-size: 18px; font-weight: 500; line-height: 26px; letter-spacing: -0.2px">“Spent 200 taka on lunch with bKash, remind me to call the doctor at 5, and add Napa 3 times a day for 5 days.”</p>
  </section>

  <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 2px 4px 0">
    <h2 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.4px">3 things to add</h2>
    <span style="font-size: 13px; color: #6B625C">Tap a card to adjust</span>
  </div>

  <button style="display: flex; align-items: center; gap: 14px; background: #FFFFFF; border: none; border-radius: 22px; padding: 14px; text-align: left; color: #1A1614; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
    <span style="width: 48px; height: 48px; border-radius: 16px; background: #F4EEFB; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7E52BE" stroke-width="2" stroke-linejoin="round"><path d="M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4z"></path><path d="M4 7l11-3v3"></path><circle cx="16" cy="13.5" r="1.3" fill="#7E52BE"></circle></svg></span>
    <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
      <span style="font-size: 11px; font-weight: 800; color: #6A41A8; letter-spacing: 0.6px; text-transform: uppercase">Expense</span>
      <span style="font-size: 17px; font-weight: 700; letter-spacing: -0.2px">৳ 200 · Lunch</span>
      <span style="font-size: 13px; color: #6B625C">Food · bKash · Today</span>
    </span>
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A39B96" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
  </button>

  <button style="display: flex; align-items: center; gap: 14px; background: #FFFFFF; border: none; border-radius: 22px; padding: 14px; text-align: left; color: #1A1614; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
    <span style="width: 48px; height: 48px; border-radius: 16px; background: #EAEFFD; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4A67C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M8.5 12.2l2.4 2.4 4.6-4.8"></path></svg></span>
    <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
      <span style="font-size: 11px; font-weight: 800; color: #3B4F8F; letter-spacing: 0.6px; text-transform: uppercase">Task</span>
      <span style="font-size: 17px; font-weight: 700; letter-spacing: -0.2px">Call the doctor</span>
      <span style="font-size: 13px; color: #6B625C">Today 5:00 PM · reminder on</span>
    </span>
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A39B96" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
  </button>

  <button style="display: flex; flex-direction: column; gap: 12px; background: #FFFFFF; border: none; border-radius: 22px; padding: 14px; text-align: left; color: #1A1614; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06); outline: 2px solid #D98A2B; outline-offset: -2px">
    <span style="display: flex; align-items: center; gap: 14px; width: 100%">
      <span style="width: 48px; height: 48px; border-radius: 16px; background: #FFE7E0; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E24E32" stroke-width="2"><rect x="3.5" y="8.5" width="17" height="7" rx="3.5" transform="rotate(-40 12 12)"></rect><path d="M9.6 8.8l4.8 6.4"></path></svg></span>
      <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
        <span style="font-size: 11px; font-weight: 800; color: #B23A1F; letter-spacing: 0.6px; text-transform: uppercase">Medicine</span>
        <span style="font-size: 17px; font-weight: 700; letter-spacing: -0.2px">Napa</span>
        <span style="font-size: 13px; color: #6B625C">3× daily · 5 days · for Me</span>
      </span>
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A39B96" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
    </span>
    <span style="display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; padding: 9px 12px; border-radius: 14px; background: #FBF1E3; font-size: 13px; font-weight: 600; color: #7A4A10"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A35E12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9 16H3z"></path><path d="M12 10v4M12 17h.01"></path></svg>No strength heard — tap to add the dose</span>
  </button>

  <div style="display: flex; align-items: center; gap: 10px; margin-top: auto">
    <button aria-label="Add something else by voice" style="width: 58px; height: 58px; border-radius: 29px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.08)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg></button>
    <button aria-label="Discard" style="width: 58px; height: 58px; border-radius: 29px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.08)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B3261E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"></path></svg></button>
    <button style="flex-grow: 1; height: 58px; border-radius: 29px; border: none; background: #1A1614; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 12px 30px rgba(26,22,20,0.25)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>Save all 3</button>
  </div>
</div>


</body>
</html>
