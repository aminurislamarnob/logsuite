<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks board</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3F5DB8}a:hover{color:#2E4790}
button{font-family:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F1EE; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1A1614; padding: 56px 0 0 20px; display: flex; flex-direction: column; gap: 16px">

  <header style="display: flex; align-items: center; gap: 10px; padding-right: 20px">
    <a href="#" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0 0 0 2px; font-size: 28px; font-weight: 800; letter-spacing: -0.8px; flex-grow: 1">Tasks</h1>
    <button aria-label="Change view, Board selected" style="height: 44px; padding: 0 12px 0 14px; border-radius: 22px; border: none; background: #1A1614; color: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="16" rx="2"></rect><rect x="13.5" y="4" width="6.5" height="10" rx="2"></rect></svg>Board<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B5ADA8" stroke-width="2.4" stroke-linecap="round"><path d="M7 10l5 5 5-5"></path></svg></button>
    <button aria-label="Search tasks" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4-4"></path></svg></button>
  </header>

  <div style="display: flex; align-items: center; gap: 8px; padding-right: 20px">
    <button style="white-space: nowrap; height: 40px; padding: 0 12px 0 14px; border-radius: 20px; border: none; background: #FFFFFF; font-size: 13px; font-weight: 700; color: #1A1614; display: flex; align-items: center; gap: 6px; box-shadow: 0 1px 2px rgba(26,22,20,0.05)">All projects<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B625C" stroke-width="2.4" stroke-linecap="round"><path d="M7 10l5 5 5-5"></path></svg></button>
    <span style="flex-grow: 1"></span>
    <div role="img" aria-label="Column 1 of 3" style="display: flex; gap: 5px"><span style="width: 20px; height: 6px; border-radius: 3px; background: #1A1614"></span><span style="width: 6px; height: 6px; border-radius: 3px; background: #CFC8C2"></span><span style="width: 6px; height: 6px; border-radius: 3px; background: #CFC8C2"></span></div>
  </div>

  <div style="display: flex; gap: 12px; align-items: flex-start; width: 860px">
    <section aria-label="To do" style="width: 272px; flex-shrink: 0; background: #EBE6E2; border-radius: 26px; padding: 14px 10px 10px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px; padding: 0 6px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #4A67C4"></span><h2 style="margin: 0; font-size: 16px; font-weight: 700; flex-grow: 1">To do</h2><span style="height: 24px; min-width: 24px; padding: 0 7px; box-sizing: border-box; border-radius: 12px; background: #FFFFFF; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">3</span></div>
      <article style="background: #FFFFFF; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
        <div style="display: flex; align-items: flex-start; gap: 8px"><span style="font-size: 15px; font-weight: 700; line-height: 1.3; flex-grow: 1">Pay electricity bill</span><span style="height: 22px; padding: 0 7px; border-radius: 7px; background: #FDECEA; color: #B3261E; font-size: 11px; font-weight: 800; display: flex; align-items: center">P1</span></div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px"><span style="height: 24px; padding: 0 9px; border-radius: 12px; background: #FDECEA; color: #B3261E; font-weight: 700; display: flex; align-items: center">Overdue · yesterday</span><span style="color: #6B625C">Home</span></div>
      </article>
      <article style="background: #FFFFFF; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
        <div style="display: flex; align-items: flex-start; gap: 8px"><span style="font-size: 15px; font-weight: 700; line-height: 1.3; flex-grow: 1">Call the doctor</span><span style="height: 22px; padding: 0 7px; border-radius: 7px; background: #FBF1E3; color: #A35E12; font-size: 11px; font-weight: 800; display: flex; align-items: center">P2</span></div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px"><span style="height: 24px; padding: 0 9px; border-radius: 12px; background: #F0ECE8; color: #1A1614; font-weight: 700; display: flex; align-items: center">Today 5:00 PM</span><span style="color: #6B625C">Health</span></div>
      </article>
      <article style="background: #FFFFFF; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
        <span style="font-size: 15px; font-weight: 700; line-height: 1.3">Buy groceries</span>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px"><span style="height: 24px; padding: 0 9px; border-radius: 12px; background: #F0ECE8; color: #1A1614; font-weight: 700; display: flex; align-items: center">Today</span><span style="color: #6B625C">Home</span></div>
      </article>
      <button style="height: 44px; border-radius: 16px; border: 1.5px dashed #BDB5AF; background: transparent; font-size: 14px; font-weight: 600; color: #5E5752; display: flex; align-items: center; justify-content: center; gap: 6px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E5752" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add task</button>
    </section>

    <section aria-label="In progress" style="width: 272px; flex-shrink: 0; background: #EBE6E2; border-radius: 26px; padding: 14px 10px 10px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px; padding: 0 6px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #D98A2B"></span><h2 style="margin: 0; font-size: 16px; font-weight: 700; flex-grow: 1">In progress</h2><span style="height: 24px; min-width: 24px; padding: 0 7px; box-sizing: border-box; border-radius: 12px; background: #FFFFFF; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">1</span></div>
      <article style="background: #FFFFFF; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
        <span style="font-size: 15px; font-weight: 700; line-height: 1.3">Finish design review</span>
        <div style="display: flex; align-items: center; gap: 8px"><div style="width: 72px; height: 5px; border-radius: 3px; background: #EFEAE6"><div style="width: 66%; height: 5px; border-radius: 3px; background: #4A67C4"></div></div><span style="font-size: 12px; color: #6B625C">2/3 · Work</span></div>
      </article>
      <button style="height: 44px; border-radius: 16px; border: 1.5px dashed #BDB5AF; background: transparent; font-size: 14px; font-weight: 600; color: #5E5752">Add task</button>
    </section>

    <section aria-label="Done" style="width: 272px; flex-shrink: 0; background: #EBE6E2; border-radius: 26px; padding: 14px 10px 10px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px; padding: 0 6px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #2D8657"></span><h2 style="margin: 0; font-size: 16px; font-weight: 700; flex-grow: 1">Done</h2></div>
    </section>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 24px; height: 62px; border-radius: 31px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 14px 36px rgba(26,22,20,0.14); display: flex; align-items: center; gap: 6px; padding: 0 8px 0 20px">
    <label for="newtask" style="position: absolute; left: -9999px">New task</label>
    <input id="newtask" placeholder="Add to To do…" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 15px; color: #1A1614">
    <button aria-label="Add task" style="width: 46px; height: 46px; border-radius: 23px; border: none; background: #1A1614; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
  </div>
</div>


</body>
</html>
