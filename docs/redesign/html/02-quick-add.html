<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick add</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2401F}a:hover{color:#9A3016}
button{font-family:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #2B2522; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1A1614">

  <div aria-hidden="true" style="position: absolute; left: 20px; right: 20px; top: 44px; display: flex; flex-direction: column; gap: 18px; opacity: 0.18">
    <div style="display: flex; align-items: center; gap: 12px"><span style="width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF"></span><span style="flex-grow: 1; height: 22px; border-radius: 11px; background: #FFFFFF; max-width: 160px"></span></div>
    <div style="height: 170px; border-radius: 28px; background: #FFFFFF"></div>
  </div>

  <section aria-label="Quick add" style="position: absolute; left: 0; right: 0; bottom: 0; height: 724px; background: #F4F1EE; border-radius: 32px 32px 0 0; box-sizing: border-box; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 -20px 60px rgba(0,0,0,0.35)">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D9D3CE"></div>

    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.8px">Add</h1>
      <a href="#" aria-label="Close" style="width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>

    <div style="border-radius: 26px; background: #1A1614; color: #FFFFFF; padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 16px 40px rgba(26,22,20,0.25)">
      <div style="display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#F15F43"><path d="M12 2.5l2.1 5.4 5.4 2.1-5.4 2.1L12 17.5l-2.1-5.4L4.5 10l5.4-2.1z"></path><path d="M19 15l.9 2.1 2.1.9-2.1.9L19 21l-.9-2.1-2.1-.9 2.1-.9z"></path></svg><label for="cmd" style="font-size: 12px; font-weight: 700; color: #F15F43; letter-spacing: 0.8px; text-transform: uppercase">Say it or type it</label></div>
      <textarea id="cmd" rows="2" style="border: none; outline: none; resize: none; background: transparent; font-family: inherit; font-size: 19px; font-weight: 500; line-height: 26px; color: #FFFFFF; letter-spacing: -0.2px; padding: 0">Lunch 200 taka with bKash, and remind me to call the doctor at 5</textarea>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <span style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 8px; border-radius: 15px; background: rgba(255,255,255,0.10); font-size: 13px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 4px; background: #B58DEC"></span>৳ 200 · Food · bKash</span>
        <span style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 8px; border-radius: 15px; background: rgba(255,255,255,0.10); font-size: 13px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 4px; background: #7E9CF6"></span>Call the doctor · 5:00 PM</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding-top: 2px">
        <button aria-label="Scan a document" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></button>
        <button aria-label="Speak" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg></button>
        <span style="flex-grow: 1"></span>
        <button style="height: 44px; padding: 0 20px; border-radius: 22px; border: none; background: #FFFFFF; color: #1A1614; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px">Add both<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0 4px; font-size: 13px; font-weight: 700; color: #8C847F; letter-spacing: 0.8px; text-transform: uppercase">Or pick one</h2>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
        <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 4px 12px; border-radius: 20px; background: #FFFFFF; text-decoration: none; color: #1A1614; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.05)"><span style="width: 44px; height: 44px; border-radius: 22px; background: #EAEFFD; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A67C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M8.5 12.2l2.4 2.4 4.6-4.8"></path></svg></span><span style="font-size: 12px; font-weight: 600">Task</span></a>
        <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 4px 12px; border-radius: 20px; background: #FFFFFF; text-decoration: none; color: #1A1614; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.05)"><span style="width: 44px; height: 44px; border-radius: 22px; background: #F2ECFB; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7E52BE" stroke-width="2" stroke-linejoin="round"><path d="M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4z"></path><path d="M4 7l11-3v3"></path><circle cx="16" cy="13.5" r="1.3" fill="#7E52BE"></circle></svg></span><span style="font-size: 12px; font-weight: 600">Expense</span></a>
        <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 4px 12px; border-radius: 20px; background: #FFFFFF; text-decoration: none; color: #1A1614; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.05)"><span style="width: 44px; height: 44px; border-radius: 22px; background: #E6F4EC; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2D8657" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-4 0-6.5-2.6-6.5-6 0-4 3.5-6 4-10 2.5 1.5 3.5 4 3.5 6 1-.5 2-1.8 2.2-3 1.8 1.8 3.3 4.2 3.3 7 0 3.4-2.5 6-6.5 6z"></path></svg></span><span style="font-size: 12px; font-weight: 600">Habit</span></a>
        <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 4px 12px; border-radius: 20px; background: #FFFFFF; text-decoration: none; color: #1A1614; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.05)"><span style="width: 44px; height: 44px; border-radius: 22px; background: #FFECE7; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E24E32" stroke-width="2"><rect x="3.5" y="8.5" width="17" height="7" rx="3.5" transform="rotate(-40 12 12)"></rect><path d="M9.6 8.8l4.8 6.4"></path></svg></span><span style="font-size: 12px; font-weight: 600">Medicine</span></a>
        <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 4px 12px; border-radius: 20px; background: #FFFFFF; text-decoration: none; color: #1A1614; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.05)"><span style="width: 44px; height: 44px; border-radius: 22px; background: #FBF1E3; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A86C22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h8l4 4V20.5H6z"></path><path d="M9 12h6M9 16h4"></path></svg></span><span style="font-size: 12px; font-weight: 600">Note</span></a>
        <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 4px 12px; border-radius: 20px; background: #FFFFFF; text-decoration: none; color: #1A1614; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.05)"><span style="width: 44px; height: 44px; border-radius: 22px; background: #E4F3F4; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B8790" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="7.5"></circle><path d="M12 9.5V13l2.5 1.5M10 3h4"></path></svg></span><span style="font-size: 12px; font-weight: 600">Focus</span></a>
        <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 4px 12px; border-radius: 20px; background: #FFFFFF; text-decoration: none; color: #1A1614; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.05)"><span style="width: 44px; height: 44px; border-radius: 22px; background: #E3F1FA; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0274B0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l2.5-8h11L20 13v6H4z"></path><path d="M4 13h4.5l1 2h5l1-2H20"></path></svg></span><span style="font-size: 12px; font-weight: 600">Drop</span></a>
        <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 4px 12px; border-radius: 20px; background: #FFFFFF; text-decoration: none; color: #1A1614; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.05)"><span style="width: 44px; height: 44px; border-radius: 22px; background: #EFECEA; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A4544" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h13l-3.5-3.5M19 15H6l3.5 3.5"></path></svg></span><span style="font-size: 12px; font-weight: 600">Transfer</span></a>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0 4px; font-size: 13px; font-weight: 700; color: #8C847F; letter-spacing: 0.8px; text-transform: uppercase">Again</h2>
      <div style="display: flex; gap: 8px; overflow: hidden">
        <button style="flex-shrink: 0; height: 44px; padding: 0 16px 0 12px; border-radius: 22px; border: none; background: #FFFFFF; font-size: 14px; font-weight: 600; color: #1A1614; display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.05)"><span style="width: 8px; height: 8px; border-radius: 4px; background: #9A6DD7"></span>Rickshaw ৳ 60</button>
        <button style="flex-shrink: 0; height: 44px; padding: 0 16px 0 12px; border-radius: 22px; border: none; background: #FFFFFF; font-size: 14px; font-weight: 600; color: #1A1614; display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.05)"><span style="width: 8px; height: 8px; border-radius: 4px; background: #2D8657"></span>Water +1</button>
        <button style="flex-shrink: 0; height: 44px; padding: 0 16px 0 12px; border-radius: 22px; border: none; background: #FFFFFF; font-size: 14px; font-weight: 600; color: #1A1614; display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.05)"><span style="width: 8px; height: 8px; border-radius: 4px; background: #349CA5"></span>25-min focus</button>
        <button style="flex-shrink: 0; height: 44px; padding: 0 16px 0 12px; border-radius: 22px; border: none; background: #FFFFFF; font-size: 14px; font-weight: 600; color: #1A1614; display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.05)"><span style="width: 8px; height: 8px; border-radius: 4px; background: #9A6DD7"></span>Lunch ৳ 200</button>
      </div>
    </div>
  </section>
</div>


</body>
</html>
