<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App lock</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF7D63}a:hover{color:#FFA996}
button{font-family:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #14100F; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #FFFFFF; padding: 84px 36px 36px; display: flex; flex-direction: column; align-items: center; gap: 18px">

  <span style="font-size: 24px; font-weight: 800; letter-spacing: -0.6px">log<span style="color: #FF7D63">Suite</span></span>

  <span style="width: 64px; height: 64px; border-radius: 32px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; margin-top: 18px"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2.5"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.7px">Enter your PIN</h1>
    <span style="font-size: 14px; color: #B5ADA8">Your data stays locked on this device</span>
  </div>

  <div role="img" aria-label="2 of 4 digits entered" style="display: flex; gap: 18px; padding: 8px 0 4px">
    <span style="width: 18px; height: 18px; border-radius: 9px; background: #FF7D63"></span>
    <span style="width: 18px; height: 18px; border-radius: 9px; background: #FF7D63"></span>
    <span style="width: 18px; height: 18px; border-radius: 9px; border: 2px solid #5E5752; box-sizing: border-box"></span>
    <span style="width: 18px; height: 18px; border-radius: 9px; border: 2px solid #5E5752; box-sizing: border-box"></span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, 76px); gap: 16px 28px; margin-top: auto">
    <button style="width: 76px; height: 76px; border-radius: 38px; border: none; background: rgba(255,255,255,0.08); color: #FFFFFF; font-size: 30px; font-weight: 600">1</button>
    <button style="width: 76px; height: 76px; border-radius: 38px; border: none; background: rgba(255,255,255,0.08); color: #FFFFFF; font-size: 30px; font-weight: 600">2</button>
    <button style="width: 76px; height: 76px; border-radius: 38px; border: none; background: rgba(255,255,255,0.08); color: #FFFFFF; font-size: 30px; font-weight: 600">3</button>
    <button style="width: 76px; height: 76px; border-radius: 38px; border: none; background: rgba(255,255,255,0.08); color: #FFFFFF; font-size: 30px; font-weight: 600">4</button>
    <button style="width: 76px; height: 76px; border-radius: 38px; border: none; background: rgba(255,255,255,0.08); color: #FFFFFF; font-size: 30px; font-weight: 600">5</button>
    <button style="width: 76px; height: 76px; border-radius: 38px; border: none; background: rgba(255,255,255,0.08); color: #FFFFFF; font-size: 30px; font-weight: 600">6</button>
    <button style="width: 76px; height: 76px; border-radius: 38px; border: none; background: rgba(255,255,255,0.08); color: #FFFFFF; font-size: 30px; font-weight: 600">7</button>
    <button style="width: 76px; height: 76px; border-radius: 38px; border: none; background: rgba(255,255,255,0.08); color: #FFFFFF; font-size: 30px; font-weight: 600">8</button>
    <button style="width: 76px; height: 76px; border-radius: 38px; border: none; background: rgba(255,255,255,0.08); color: #FFFFFF; font-size: 30px; font-weight: 600">9</button>
    <button aria-label="Unlock with fingerprint or face" style="width: 76px; height: 76px; border-radius: 38px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FF7D63" stroke-width="1.8" stroke-linecap="round"><path d="M6 8.5a7 7 0 0 1 12 0M4.5 13a7.5 7.5 0 0 1 .4-2.4M19.1 10.6c.3.8.4 1.6.4 2.4 0 2.6-.4 4.6-1 6M8 20c.9-2 1.3-4.300 1.300-7a2.700 2.700 0 0 1 5.400 0c0 2.800-.4 5.300-1.200 7.500M12 13c0 3-.5 5.600-1.500 8M5.500 17c.3-1.200.5-2.500.5-4"></path></svg></button>
    <button style="width: 76px; height: 76px; border-radius: 38px; border: none; background: rgba(255,255,255,0.08); color: #FFFFFF; font-size: 30px; font-weight: 600">0</button>
    <button aria-label="Delete digit" style="width: 76px; height: 76px; border-radius: 38px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M9 5h11v14H9l-6-7z"></path><path d="M12.5 9.500l5 5M17.500 9.500l-5 5"></path></svg></button>
  </div>

  <a href="#" style="height: 44px; padding: 0 16px; display: flex; align-items: center; font-size: 14px; font-weight: 700; text-decoration: none; margin-top: 6px">Forgot PIN?</a>
</div>


</body>
</html>
