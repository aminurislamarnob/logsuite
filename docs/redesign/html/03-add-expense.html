<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add expense</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2401F}a:hover{color:#9A3016}
button{font-family:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F1EE; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1A1614; padding: 56px 20px 28px; display: flex; flex-direction: column; gap: 16px">

  <header style="display: flex; align-items: center; gap: 10px">
    <a href="#" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <div role="tablist" aria-label="Entry type" style="flex-grow: 1; display: flex; height: 44px; border-radius: 22px; background: #E8E3DF; padding: 4px; box-sizing: border-box">
      <button role="tab" aria-selected="true" style="flex: 1; border: none; border-radius: 18px; background: #1A1614; color: #FFFFFF; font-size: 14px; font-weight: 700">Expense</button>
      <button role="tab" aria-selected="false" style="flex: 1; border: none; border-radius: 18px; background: transparent; font-size: 14px; font-weight: 600; color: #5E5752">Income</button>
      <button role="tab" aria-selected="false" style="flex: 1; border: none; border-radius: 18px; background: transparent; font-size: 14px; font-weight: 600; color: #5E5752">Transfer</button>
    </div>
    <button aria-label="Scan a receipt" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M7 12h10"></path></svg></button>
  </header>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 10px 0 4px">
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 64px"><span style="font-size: 40px; font-weight: 700; color: #F15F43; line-height: 1">৳</span><span style="font-size: 64px; font-weight: 800; letter-spacing: -3px; line-height: 1">450</span></div>
    <div style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 17px; background: #FFFFFF; font-size: 13px; font-weight: 600; color: #5E5752; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><span style="width: 8px; height: 8px; border-radius: 4px; background: #9A6DD7"></span>Food<span style="color: #C9C2BC">·</span>bKash<span style="color: #C9C2BC">·</span>Today</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px"><span style="font-size: 12px; font-weight: 700; color: #8C847F; letter-spacing: 0.8px; text-transform: uppercase">Category</span><a href="#" style="font-size: 13px; font-weight: 700; text-decoration: none; color: #1A1614; display: flex; align-items: center; gap: 2px">All 12<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a></div>
    <div style="display: flex; justify-content: space-between">
      <button aria-pressed="true" style="width: 62px; display: flex; flex-direction: column; align-items: center; gap: 6px; border: none; background: transparent; padding: 0"><span style="width: 56px; height: 56px; border-radius: 28px; background: #7E52BE; box-shadow: 0 0 0 3px #F4F1EE, 0 0 0 5px #7E52BE; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M16 21V3c-2 1-3 4-3 7h3"></path></svg></span><span style="font-size: 12px; font-weight: 700">Food</span></button>
      <button aria-pressed="false" style="width: 62px; display: flex; flex-direction: column; align-items: center; gap: 6px; border: none; background: transparent; padding: 0"><span style="width: 56px; height: 56px; border-radius: 28px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5E5752" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="16" height="12" rx="3"></rect><path d="M4 11h16M7 19l1-3M17 19l-1-3"></path></svg></span><span style="font-size: 12px; font-weight: 600; color: #5E5752">Transport</span></button>
      <button aria-pressed="false" style="width: 62px; display: flex; flex-direction: column; align-items: center; gap: 6px; border: none; background: transparent; padding: 0"><span style="width: 56px; height: 56px; border-radius: 28px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5E5752" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6" stroke-linecap="round"></path></svg></span><span style="font-size: 12px; font-weight: 600; color: #5E5752">Bills</span></button>
      <button aria-pressed="false" style="width: 62px; display: flex; flex-direction: column; align-items: center; gap: 6px; border: none; background: transparent; padding: 0"><span style="width: 56px; height: 56px; border-radius: 28px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5E5752" stroke-width="2" stroke-linejoin="round"><path d="M5 8h14l-1.5 12h-11z"></path><path d="M9 8a3 3 0 0 1 6 0" stroke-linecap="round"></path></svg></span><span style="font-size: 12px; font-weight: 600; color: #5E5752">Shopping</span></button>
      <button aria-pressed="false" style="width: 62px; display: flex; flex-direction: column; align-items: center; gap: 6px; border: none; background: transparent; padding: 0"><span style="width: 56px; height: 56px; border-radius: 28px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5E5752" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.3-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.7-7 10-7 10z"></path></svg></span><span style="font-size: 12px; font-weight: 600; color: #5E5752">Health</span></button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 12px; font-weight: 700; color: #8C847F; letter-spacing: 0.8px; text-transform: uppercase; padding: 0 4px">Paid from</span>
    <div style="display: flex; gap: 8px">
      <button aria-pressed="false" style="flex: 1; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; font-size: 14px; font-weight: 600; color: #5E5752; box-shadow: 0 1px 2px rgba(26,22,20,0.05)">Cash</button>
      <button aria-pressed="true" style="flex: 1; height: 44px; border-radius: 22px; border: none; background: #1A1614; font-size: 14px; font-weight: 700; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>bKash</button>
      <button aria-pressed="false" style="flex: 1; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; font-size: 14px; font-weight: 600; color: #5E5752; box-shadow: 0 1px 2px rgba(26,22,20,0.05)">Nagad</button>
      <button aria-pressed="false" style="flex: 1; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; font-size: 14px; font-weight: 600; color: #5E5752; box-shadow: 0 1px 2px rgba(26,22,20,0.05)">Bank</button>
    </div>
  </div>

  <div style="display: flex; gap: 8px">
    <button style="flex: 1; height: 40px; border-radius: 20px; border: none; background: #FFFFFF; font-size: 13px; font-weight: 600; color: #1A1614; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 1px 2px rgba(26,22,20,0.05)"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8C847F" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Today</button>
    <button style="flex: 1; height: 40px; border-radius: 20px; border: none; background: #FFFFFF; font-size: 13px; font-weight: 600; color: #1A1614; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 1px 2px rgba(26,22,20,0.05)"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8C847F" stroke-width="2"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20a7 7 0 0 1 14 0"></path></svg>Me</button>
    <button style="flex: 1; height: 40px; border-radius: 20px; border: none; background: #FFFFFF; font-size: 13px; font-weight: 600; color: #8C847F; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 1px 2px rgba(26,22,20,0.05)"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8C847F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h8l4 4V20.5H6z"></path><path d="M9 12h6M9 16h4"></path></svg>Note</button>
    <button style="flex: 1; height: 40px; border-radius: 20px; border: none; background: #FFFFFF; font-size: 13px; font-weight: 600; color: #8C847F; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 1px 2px rgba(26,22,20,0.05)"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8C847F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Photo</button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: auto">
    <button style="height: 48px; border: none; border-radius: 16px; background: transparent; font-size: 24px; font-weight: 600">1</button>
    <button style="height: 48px; border: none; border-radius: 16px; background: transparent; font-size: 24px; font-weight: 600">2</button>
    <button style="height: 48px; border: none; border-radius: 16px; background: transparent; font-size: 24px; font-weight: 600">3</button>
    <button style="height: 48px; border: none; border-radius: 16px; background: transparent; font-size: 24px; font-weight: 600">4</button>
    <button style="height: 48px; border: none; border-radius: 16px; background: transparent; font-size: 24px; font-weight: 600">5</button>
    <button style="height: 48px; border: none; border-radius: 16px; background: transparent; font-size: 24px; font-weight: 600">6</button>
    <button style="height: 48px; border: none; border-radius: 16px; background: transparent; font-size: 24px; font-weight: 600">7</button>
    <button style="height: 48px; border: none; border-radius: 16px; background: transparent; font-size: 24px; font-weight: 600">8</button>
    <button style="height: 48px; border: none; border-radius: 16px; background: transparent; font-size: 24px; font-weight: 600">9</button>
    <button style="height: 48px; border: none; border-radius: 16px; background: transparent; font-size: 24px; font-weight: 600">.</button>
    <button style="height: 48px; border: none; border-radius: 16px; background: transparent; font-size: 24px; font-weight: 600">0</button>
    <button aria-label="Delete digit" style="height: 48px; border: none; border-radius: 16px; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M9 5h11v14H9l-6-7z"></path><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"></path></svg></button>
  </div>

  <button style="height: 58px; border-radius: 29px; border: none; background: #1A1614; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 24px; margin-top: 4px; box-shadow: 0 12px 30px rgba(26,22,20,0.25)"><span>Save expense</span><span style="height: 40px; padding: 0 16px; border-radius: 20px; background: rgba(255,255,255,0.14); display: flex; align-items: center; font-size: 15px; font-weight: 800">৳ 450</span></button>
</div>


</body>
</html>
