<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan result</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2401F}a:hover{color:#9A3016}
button{font-family:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F1EE; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1A1614; padding: 56px 20px 28px; display: flex; flex-direction: column; gap: 14px">

  <header style="display: flex; align-items: center; gap: 10px">
    <a href="#" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0 0 0 2px; font-size: 28px; font-weight: 800; letter-spacing: -0.8px; flex-grow: 1">What we found</h1>
  </header>

  <div role="tablist" aria-label="Document type" style="display: flex; height: 44px; padding: 4px; box-sizing: border-box; border-radius: 22px; background: #E8E3DF">
    <button role="tab" aria-selected="true" style="flex: 1; border: none; border-radius: 18px; background: #1A1614; color: #FFFFFF; font-size: 14px; font-weight: 700">Receipt</button>
    <button role="tab" aria-selected="false" style="flex: 1; border: none; border-radius: 18px; background: transparent; font-size: 14px; font-weight: 600; color: #5E5752">Prescription</button>
  </div>

  <div role="img" aria-label="Scanned receipt with the merchant, date and total highlighted" style="position: relative; height: 196px; border-radius: 24px; background: #1A1614; overflow: hidden; flex-shrink: 0">
    <div style="position: absolute; left: 146px; top: 14px; width: 198px; height: 220px; border-radius: 6px; background: #FBFAF8; transform: rotate(-2deg); padding: 16px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 9px">
      <span style="height: 12px; width: 62%; border-radius: 3px; background: #1A1614; align-self: center"></span>
      <span style="height: 6px; width: 40%; border-radius: 3px; background: #CFC8C2; align-self: center"></span>
      <span style="height: 1px; background: #E4DFDB; margin: 2px 0"></span>
      <span style="display: flex; justify-content: space-between"><span style="height: 6px; width: 52%; border-radius: 3px; background: #CFC8C2"></span><span style="height: 6px; width: 18%; border-radius: 3px; background: #CFC8C2"></span></span>
      <span style="display: flex; justify-content: space-between"><span style="height: 6px; width: 40%; border-radius: 3px; background: #CFC8C2"></span><span style="height: 6px; width: 16%; border-radius: 3px; background: #CFC8C2"></span></span>
      <span style="display: flex; justify-content: space-between"><span style="height: 6px; width: 58%; border-radius: 3px; background: #CFC8C2"></span><span style="height: 6px; width: 18%; border-radius: 3px; background: #CFC8C2"></span></span>
      <span style="height: 1px; background: #E4DFDB; margin: 2px 0"></span>
      <span style="display: flex; justify-content: space-between"><span style="height: 9px; width: 26%; border-radius: 3px; background: #1A1614"></span><span style="height: 9px; width: 28%; border-radius: 3px; background: #1A1614"></span></span>
    </div>
    <span style="position: absolute; left: 174px; top: 24px; width: 138px; height: 24px; border-radius: 6px; border: 2px solid #FF7D63; box-sizing: border-box; transform: rotate(-2deg)"></span>
    <span style="position: absolute; left: 200px; top: 46px; width: 92px; height: 18px; border-radius: 6px; border: 2px solid #FF7D63; box-sizing: border-box; transform: rotate(-2deg)"></span>
    <span style="position: absolute; left: 264px; top: 142px; width: 70px; height: 22px; border-radius: 6px; border: 2px solid #FF7D63; background: rgba(255,125,99,0.18); box-sizing: border-box; transform: rotate(-2deg)"></span>
    <span style="position: absolute; left: 12px; bottom: 12px; height: 28px; padding: 0 10px; border-radius: 14px; background: rgba(255,255,255,0.14); color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px"><span style="width: 7px; height: 7px; border-radius: 4px; background: #FF7D63"></span>3 fields read</span>
  </div>

  <div style="background: #FFFFFF; border-radius: 24px; padding: 2px 16px; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
    <div style="display: flex; align-items: center; gap: 12px; height: 60px; border-bottom: 1px solid #F0ECE8">
      <label for="merchant" style="width: 84px; font-size: 13px; font-weight: 600; color: #6B625C; flex-shrink: 0">Merchant</label>
      <input id="merchant" value="Corner Grocery" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 16px; font-weight: 600; color: #1A1614">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A39B96" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L19 8l-3-3L5 16z"></path></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; height: 60px; border-bottom: 1px solid #F0ECE8">
      <label for="amount" style="width: 84px; font-size: 13px; font-weight: 600; color: #6B625C; flex-shrink: 0">Amount</label>
      <input id="amount" value="৳ 1,240" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: #1A1614">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A39B96" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L19 8l-3-3L5 16z"></path></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; height: 60px; border-bottom: 1px solid #F0ECE8">
      <label for="date" style="width: 84px; font-size: 13px; font-weight: 600; color: #6B625C; flex-shrink: 0">Date</label>
      <input id="date" value="Tue, 17 Nov 2026" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 16px; font-weight: 600; color: #1A1614">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A39B96" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L19 8l-3-3L5 16z"></path></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; height: 60px">
      <span style="width: 84px; font-size: 13px; font-weight: 600; color: #6B625C; flex-shrink: 0">Category</span>
      <button style="height: 36px; padding: 0 12px 0 10px; border-radius: 18px; border: none; background: #F4EEFB; font-size: 14px; font-weight: 700; color: #1A1614; display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #9A6DD7"></span>Groceries<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5E5752" stroke-width="2.4" stroke-linecap="round"><path d="M7 10l5 5 5-5"></path></svg></button>
      <span style="font-size: 12px; color: #6B625C">Suggested</span>
    </div>
  </div>

  <button aria-expanded="false" style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px; border-radius: 18px; border: none; background: #EBE6E2; font-size: 14px; font-weight: 600; color: #1A1614; text-align: left"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E5752" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"></path></svg><span style="flex-grow: 1">Raw text <span style="font-weight: 500; color: #5E5752">· 14 lines</span></span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E5752" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5 5 5-5"></path></svg></button>

  <div style="display: flex; align-items: center; gap: 10px; margin-top: auto">
    <button style="height: 58px; padding: 0 22px; border-radius: 29px; border: none; background: #FFFFFF; color: #1A1614; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.08)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v4.5h4.5"></path></svg>Rescan</button>
    <a href="#" style="flex-grow: 1; height: 58px; border-radius: 29px; background: #1A1614; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 30px rgba(26,22,20,0.25)">Use these details</a>
  </div>
</div>


</body>
</html>
