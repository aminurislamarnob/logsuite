<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0"><template id="t">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F5E3D}a:hover{color:#174D35}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:default}
.page>*{flex-shrink:0}
</style>

<div class="page" style="width: 390px; height: 1590px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F1EE; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1A1614; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 14px">

  <header style="display: flex; align-items: center; gap: 10px">
    <a href="Habits.dc.html" aria-label="Back to habits" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="flex-grow: 1"></span>
    <a href="HabitEditor.dc.html" aria-label="Edit habit" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L19 8l-3-3L5 16z"></path></svg></a>
    <button aria-label="More: pause, archive or delete" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 4px 14px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#1A1614"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
  </header>

  <div style="display: flex; align-items: center; gap: 14px">
    <span style="width: 64px; height: 64px; border-radius: 22px; background: #2D8657; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 10px 24px rgba(45,134,87,0.28)"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"><path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"></path></svg></span>
    <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
      <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.05">Read 20 pages</h1>
      <span style="font-size: 14px; color: #6B625C">Every day · reminder 9:30 PM</span>
    </div>
  </div>

  <section aria-label="Today" style="background: #1A1614; color: #FFFFFF; border-radius: 28px; padding: 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 16px 40px rgba(26,22,20,0.22)">
    <div style="display: flex; align-items: center; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0">
        <span style="font-size: 12px; font-weight: 700; color: #7EE0AC; letter-spacing: 1px; text-transform: uppercase">{{hero.eyebrow}}</span>
        <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.15">{{hero.headline}}</span>
        <span style="font-size: 13px; color: #B5ADA8; line-height: 1.35">{{hero.sub}}</span>
      </div>
      <div style="position: relative; width: 84px; height: 84px; flex-shrink: 0">
        <svg role="img" aria-label="{{hero.ringAria}}" width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="35" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="9"></circle><circle cx="42" cy="42" r="35" fill="none" stroke="#56CE8E" stroke-width="9" stroke-linecap="round" stroke-dasharray="{{hero.dash}}" transform="rotate(-90 42 42)"></circle></svg>
        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 24px; font-weight: 800; letter-spacing: -0.8px; line-height: 1">{{hero.pages}}</span><span style="font-size: 11px; color: #B5ADA8">of 20</span></div>
      </div>
    </div>

    <sc-if value="{{hero.open}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; gap: 8px">
        <button aria-label="Add 5 pages" onClick="{{hero.add5}}" style="height: 52px; padding: 0 16px; border-radius: 26px; border: none; background: rgba(255,255,255,0.10); color: #FFFFFF; font-size: 15px; font-weight: 700">+5</button>
        <button aria-label="Add 10 pages" onClick="{{hero.add10}}" style="height: 52px; padding: 0 16px; border-radius: 26px; border: none; background: rgba(255,255,255,0.10); color: #FFFFFF; font-size: 15px; font-weight: 700">+10</button>
        <button onClick="{{hero.finish}}" style="flex-grow: 1; height: 52px; border-radius: 26px; border: none; background: #FFFFFF; color: #1A1614; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>Mark done</button>
      </div>
    </sc-if>
    <sc-if value="{{hero.closed}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; gap: 8px">
        <button aria-label="Add 5 more pages" onClick="{{hero.add5}}" style="height: 52px; padding: 0 16px; border-radius: 26px; border: none; background: rgba(255,255,255,0.10); color: #FFFFFF; font-size: 15px; font-weight: 700">+5 more</button>
        <button onClick="{{hero.undo}}" style="flex-grow: 1; height: 52px; border-radius: 26px; border: none; background: rgba(255,255,255,0.10); color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"></path></svg>Undo today</button>
      </div>
    </sc-if>

    <div style="display: flex; align-items: center; gap: 12px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.10)">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFB95C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M9 21h6M10 17h4"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1; min-width: 0">
        <div style="display: flex; justify-content: space-between; gap: 8px; font-size: 13px"><span style="font-weight: 700">{{mile.title}}</span><span style="color: #B5ADA8">{{mile.left}}</span></div>
        <div style="height: 5px; border-radius: 3px; background: rgba(255,255,255,0.12)"><div style="{{mile.barStyle}}"></div></div>
      </div>
    </div>
  </section>

  <div role="tablist" aria-label="Range" style="display: flex; height: 48px; padding: 4px; box-sizing: border-box; border-radius: 24px; background: #E8E3DF; margin-top: 4px">
    <sc-for list="{{ranges}}" as="r" hint-placeholder-count="3">
      <button role="tab" aria-selected="{{r.selected}}" onClick="{{r.pick}}" style="{{r.style}}">{{r.label}}</button>
    </sc-for>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <div style="background: #FFFFFF; border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
      <span style="font-size: 12px; font-weight: 600; color: #6B625C">Completion</span>
      <span style="font-size: 26px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.1">{{stats.rate}}<span style="font-size: 15px; letter-spacing: 0">%</span></span>
      <span style="{{stats.deltaStyle}}">{{stats.delta}}</span>
    </div>
    <div style="background: #FFFFFF; border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
      <span style="font-size: 12px; font-weight: 600; color: #6B625C">Best streak</span>
      <span style="font-size: 26px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.1">{{stats.best}}<span style="font-size: 15px; font-weight: 600; color: #6B625C; letter-spacing: 0"> days</span></span>
      <span style="font-size: 11px; font-weight: 600; color: #6B625C">{{stats.bestNote}}</span>
    </div>
    <div style="background: #FFFFFF; border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
      <span style="font-size: 12px; font-weight: 600; color: #6B625C">Pages read</span>
      <span style="font-size: 26px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.1">{{stats.pages}}</span>
      <span style="font-size: 11px; font-weight: 600; color: #6B625C">{{stats.perDay}}</span>
    </div>
  </div>

  <section aria-label="Activity" style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.3px">{{grid.title}}</h2>
      <span style="display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: #6B625C"><span style="width: 10px; height: 10px; border-radius: 3px; background: #E4DFDB"></span>Missed<span style="width: 10px; height: 10px; border-radius: 3px; background: #A7D7BB; margin-left: 4px"></span>Partly<span style="width: 10px; height: 10px; border-radius: 3px; background: #2D8657; margin-left: 4px"></span>Done</span>
    </div>

    <sc-if value="{{grid.isCal}}" hint-placeholder-val="{{ true }}">
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; font-size: 11px; font-weight: 700; color: #6B625C; text-align: center"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
    </sc-if>

    <div style="display: flex; gap: 6px">
      <sc-if value="{{grid.isWeeks}}" hint-placeholder-val="{{ false }}">
        <div aria-hidden="true" style="{{grid.dowStyle}}"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span>Sun</span></div>
      </sc-if>
      <div role="grid" aria-label="{{grid.title}}" style="{{grid.style}}">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
          <button aria-label="{{c.aria}}" disabled="{{c.disabled}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
        </sc-for>
      </div>
    </div>

    <sc-if value="{{grid.isWeeks}}" hint-placeholder-val="{{ false }}">
      <div aria-hidden="true" style="{{grid.monthStyle}}">
        <sc-for list="{{months}}" as="m" hint-placeholder-count="4"><span style="white-space: nowrap; min-width: 0">{{m.label}}</span></sc-for>
      </div>
    </sc-if>

    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; border-radius: 18px; background: #F4F1EE">
      <span style="{{sel.dotStyle}}"></span>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
        <span style="font-size: 15px; font-weight: 700">{{sel.title}}</span>
        <span style="font-size: 13px; color: #5E5752">{{sel.detail}}</span>
      </div>
      <sc-if value="{{sel.hasBtn}}" hint-placeholder-val="{{ true }}">
        <button onClick="{{sel.toggle}}" style="{{sel.btnStyle}}">{{sel.btn}}</button>
      </sc-if>
    </div>
    <span style="font-size: 12px; color: #6B625C; text-align: center">Tap any day to see or fix it</span>
  </section>

  <section aria-label="Insight" style="background: #E6F4EC; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
    <div style="display: flex; gap: 12px">
      <span style="width: 40px; height: 40px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F5E3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"></path></svg></span>
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <span style="font-size: 15px; font-weight: 700">{{insight.title}}</span>
        <span style="font-size: 13px; color: #33503F; line-height: 1.4">{{insight.body}}</span>
      </div>
    </div>
    <div role="img" aria-label="{{week.aria}}" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 76px; padding: 10px 12px 8px; border-radius: 16px; background: #FFFFFF">
      <sc-for list="{{week.bars}}" as="b" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end">
          <span style="{{b.barStyle}}"></span>
          <span style="{{b.labelStyle}}">{{b.day}}</span>
        </div>
      </sc-for>
    </div>
    <sc-if value="{{insight.hasAction}}" hint-placeholder-val="{{ true }}">
      <a href="HabitEditor.dc.html" style="align-self: flex-start; height: 40px; padding: 0 16px; border-radius: 20px; background: #1A1614; color: #FFFFFF; font-size: 13px; font-weight: 700; text-decoration: none; display: flex; align-items: center">{{insight.action}}</a>
    </sc-if>
  </section>

  <section aria-label="Trend" style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.3px">Getting steadier?</h2>
      <span style="{{chart.verdictStyle}}">{{chart.verdict}}</span>
    </div>
    <div style="display: flex; gap: 6px">
      <div aria-hidden="true" style="display: flex; flex-direction: column; justify-content: space-between; height: 96px; font-size: 10px; font-weight: 600; color: #6B625C; text-align: right; width: 30px; flex-shrink: 0"><span>100%</span><span>50%</span><span>0%</span></div>
      <svg role="img" aria-label="{{chart.aria}}" width="100%" height="96" viewBox="0 0 300 96" preserveAspectRatio="none" style="overflow: visible">
        <line x1="0" y1="1" x2="300" y2="1" stroke="#F0ECE8" stroke-width="1"></line>
        <line x1="0" y1="48" x2="300" y2="48" stroke="#F0ECE8" stroke-width="1"></line>
        <line x1="0" y1="95" x2="300" y2="95" stroke="#E4DFDB" stroke-width="1"></line>
        <path d="{{chart.area}}" fill="#2D8657" fill-opacity="0.12"></path>
        <line x1="0" y1="{{chart.goalY}}" x2="300" y2="{{chart.goalY}}" stroke="#A35E12" stroke-width="1.5" stroke-dasharray="4 4"></line>
        <path d="{{chart.line}}" fill="none" stroke="#2D8657" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></path>
        <circle cx="300" cy="{{chart.endY}}" r="5" fill="#2D8657" stroke="#FFFFFF" stroke-width="2.5"></circle>
      </svg>
    </div>
    <div aria-hidden="true" style="display: flex; justify-content: space-between; padding-left: 36px; font-size: 11px; font-weight: 600; color: #6B625C"><span>{{chart.start}}</span><span>{{chart.mid}}</span><span>Today</span></div>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #6B625C"><span style="width: 14px; height: 0; border-top: 2px dashed #A35E12"></span>7-day average against your 80% target</span>
  </section>

  <div style="display: flex; gap: 10px; padding-top: 4px">
    <button style="flex: 1; height: 52px; border-radius: 26px; border: none; background: #FFFFFF; color: #1A1614; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="#1A1614"><rect x="6" y="5" width="4" height="14" rx="1.5"></rect><rect x="14" y="5" width="4" height="14" rx="1.5"></rect></svg>Pause habit</button>
    <button style="flex: 1; height: 52px; border-radius: 26px; border: none; background: #FFFFFF; color: #1A1614; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 1px 2px rgba(26,22,20,0.05), 0 6px 20px rgba(26,22,20,0.06)"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 5h16v4H4zM6 9v10h12V9M10 13h4"></path></svg>Archive</button>
  </div>
  <span style="font-size: 12px; color: #6B625C; text-align: center">Started 24 Jul · Delete is in the ⋯ menu</span>
</div>
</template><div id="root"></div></body></html>
