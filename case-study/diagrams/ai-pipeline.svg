<svg viewBox="0 0 900 420" role="img" aria-label="Sequence diagram showing the zero-leak grounded AI voice pipeline: on-device speech recognition, local entity injection, structured LLM parsing, card preview, and atomic SQLite transaction." xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="sh" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path class="d-m" d="M0 0L8 4L0 8z"/></marker>
    <marker id="sa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="d-ma" d="M0 0L8 4L0 8z"/></marker>
  </defs>

  <!-- Lifelines -->
  <line class="d-life" x1="90" y1="56" x2="90" y2="400"/>
  <line class="d-life" x1="330" y1="56" x2="330" y2="400"/>
  <line class="d-life" x1="570" y1="56" x2="570" y2="400"/>
  <line class="d-life" x1="810" y1="56" x2="810" y2="400"/>

  <!-- Actor boxes -->
  <rect class="d-box" x="30" y="20" width="120" height="36" rx="6"/><text class="d-t" x="90" y="43" text-anchor="middle">User (Voice)</text>
  <rect class="d-box" x="270" y="20" width="120" height="36" rx="6"/><text class="d-t" x="330" y="43" text-anchor="middle">App &amp; Grounding</text>
  <rect class="d-box" x="510" y="20" width="120" height="36" rx="6"/><text class="d-t" x="570" y="43" text-anchor="middle">Picked LLM Brain</text>
  <rect class="d-box" x="750" y="20" width="120" height="36" rx="6"/><text class="d-t" x="810" y="43" text-anchor="middle">Drift SQLite DB</text>

  <!-- Step 1: Voice input -->
  <line class="d-a" x1="90" y1="94" x2="329" y2="94" marker-end="url(#sa)"/>
  <text class="d-at" x="210" y="86" text-anchor="middle">Speak natural command</text>

  <!-- Step 2: Speech to text & local whitelist injection -->
  <line class="d-l" x1="330" y1="138" x2="440" y2="138"/>
  <line class="d-l" x1="440" y1="138" x2="440" y2="158"/>
  <line class="d-l" x1="440" y1="158" x2="331" y2="158" marker-end="url(#sh)"/>
  <text class="d-t" x="345" y="152">Inject category &amp; account names</text>

  <!-- Step 3: LLM prompt with keychain API key -->
  <line class="d-a" x1="330" y1="194" x2="569" y2="194" marker-end="url(#sa)"/>
  <text class="d-at" x="450" y="186" text-anchor="middle">Transcript + JSON schema + names</text>

  <!-- Step 4: LLM reply -->
  <line class="d-l d-dash" x1="570" y1="234" x2="331" y2="234" marker-end="url(#sh)"/>
  <text class="d-t" x="450" y="226" text-anchor="middle">Structured actions (kind, amount, date)</text>

  <!-- Step 5: Card preview -->
  <line class="d-l d-dash" x1="330" y1="274" x2="91" y2="274" marker-end="url(#sh)"/>
  <text class="d-t" x="210" y="266" text-anchor="middle">Present interactive Preview Sheet</text>

  <!-- Step 6: Confirmation -->
  <line class="d-a" x1="90" y1="314" x2="329" y2="314" marker-end="url(#sa)"/>
  <text class="d-at" x="210" y="306" text-anchor="middle">Confirm ("Save all" or tap to edit)</text>

  <!-- Step 7: Guarantee and Commit -->
  <rect class="d-check" x="270" y="338" width="540" height="42" rx="6"/>
  <text class="d-t" x="540" y="364" text-anchor="middle">Atomic drift transaction: zero silent rows or mis-heard creations</text>

  <line class="d-a" x1="330" y1="392" x2="809" y2="392" marker-end="url(#sa)"/>
  <text class="d-at" x="570" y="386" text-anchor="middle">Write validated rows to Drift tables</text>
</svg>
